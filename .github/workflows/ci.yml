# ─────────────────────────────────────────────────────────────────────────────
# 常规检查闸门：注册表一致性 + 包级 init() 纯度 + 编译 + 静态检查 + 测试
#
# 为什么需要这个文件：Gox 有几处**必须手工同步**的注册表，漏改一律不报错 ——
#   内置组件漏登记某个站点 → 渲染成空盒子；gx/* 模块漏进 submodules → 聚合入口
#   少一半导出；cmd/gox/main.go 与 npm/package.json 版本号脱钩 → `gox version` 撒谎。
#   release.yml 只管发版（且在发布时才发现版本号对不上），pages.yml 只管官网，
#   都不管这些。本工作流把它们一次性拦在推送阶段。
#
# 为什么测试跑在 windows-latest：Windows 是本仓库的主开发平台，也是 README 里
#   写明的本地闸门（`go test ./...`）已经全绿的平台；Linux 无头环境下的测试行为
#   没有验证过（gfx 有一批窗口/字体相关用例靠 t.Skip 兜无桌面，行为随 runner 变）。
#   宁可先把测试钉在一个已知全绿的平台上，也不要抄一个没验证过的 ubuntu 测试作业。
#   静态检查（注册表 + vet）放在 ubuntu 上跑，因为那部分与平台无关、且最快。
#
# 与其它工作流的关系：互不触发、也互不阻塞，需要用同一把闸门时靠分支保护规则
#   把这里的作业设成 required check（那是仓库设置，代码里写不了）。只读，无 secret。
#
# 失败时怎么查：注册表检查把**具体文件 + 标签 + 缺哪个站点**写进输出（脚本内部
#   已经带证据，这里只补一句 ::error:: 便于从 Actions 的 annotations 直接读到）。
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的连续推送只跑最后一次 —— 这是检查闸门，不是发版流水线，不需要排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registries:
    name: 注册表一致性 / 版本号同步
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # npm/ 是独立仓库（gox-npm），已不挂子模块：check-registries.py 要读
      # npm/package.json 与 npm/packages/*，显式 checkout 到 npm/。
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 14752222/gox-npm
          path: npm

      - name: 内置组件四处同步 / gx 模块三处同步 / 版本号一致 / npm 清单自洽 / 文档 import 一致
        run: |
          set -euo pipefail
          # 不加 `| tee` 之类的管道：失败时退出码会被管道后的命令吃掉，
          # 而这一行本身就是「编译/测试之前」的那道闸门，必须让它真的拦住。
          if ! python3 scripts/check-registries.py; then
            echo "::error::注册表一致性检查未通过 —— 具体是哪个标签缺哪个站点见上一条输出；本地可先跑 python3 scripts/check-registries.py --list 对表"
            exit 1
          fi
          # 文档/示例 import 与内置模块导出表一致（编译期报错级 + 静默 undefined 级）
          if ! python3 scripts/check-imports.py; then
            echo "::error::文档/示例 import 检查未通过 —— 具体哪个文件哪一行 import 了不存在的名字见上一条输出；故意写错的示例须登记进脚本头部 ALLOW 豁免表"
            exit 1
          fi
          # 桌面签名/公证的「缺凭证跳过」逻辑（r8ErgP）：纯静态校验，既不要凭证
          # 也不要 runner，所以放在这里（编译之前）。它守的那类坏味道 —— 给步骤
          # 加 secrets 却忘了 if 闸门 —— 只在**没配凭证**的仓库上复现，配齐凭证
          # 的人本地怎么跑都是绿的，只能靠静态判据兜住。
          if ! python3 scripts/check-signing-workflow.py --github; then
            echo "::error::release.yml 的桌面签名跳过逻辑被改坏了 —— 上面逐条列出了哪个步骤的闸门有问题；本地可先跑 python3 scripts/check-signing-workflow.py 复现"
            exit 1
          fi

  # ── 包级 init() 纯度（看板 rKjHCl）─────────────────────────────────────────
  # 为什么单独一个作业：它是 Go 侧的 AST 分析（要 Go 工具链），而 registries 是
  #   Python 侧的纯文本分析；两者的失败归因完全不同，混在一条里会互相淹没。
  #
  # 守的是 2026-10-08 那次事故：gfx/win32 的 init() 在进程启动阶段枚举网卡，
  #   结构体布局错位时连 test262 跑批都启动即 SIGSEGV —— 单点已修（改懒加载），
  #   但**没有任何机制阻止下一次**。init() 没有调用点、没有开关、也没有 recover
  #   的机会：往里放一次平台调用，就等于要求所有二进制在 main 之前先成功完成它。
  init-purity:
    name: 包级 init() 纯度（禁平台 IO / 宏内核调用）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: init() 纯度检查 + 工具自测
        run: |
          set -euo pipefail
          # 判据与输出（文件:行号 + 调用链）都在 tools/initpurity 里，这里只补
          # 一句 ::error:: —— 未登录时 job 日志读不到，注解是唯一的归因入口。
          if ! go run ./tools/initpurity ./...; then
            echo "::error::包级 init() 里出现平台 IO / 宏内核调用 —— 文件与行号见上一条输出；确属必要的加 // initpurity:allow 理由：…（理由必填）"
            exit 1
          fi
          # 守卫自身也要有守卫：负向样本必须真的红（tools/initpurity/testdata/）。
          # 一个永远输出 ok 的守卫比没有守卫更危险 —— 它会让人误以为有防线。
          if ! go test ./tools/initpurity/; then
            echo "::error::initpurity 自测未通过 —— 判据或负向样本失效，闸门可能已经不再拦任何东西"
            exit 1
          fi

  # ── apps/ 静默陷阱 lint（看板 rG73bo 3/3）──────────────────────────────────
  # 为什么单独一个作业：它扫的是 apps/ 的 **JS 源码**，与 registries 的注册表
  #   文本分析、init-purity 的 Go AST 分析三者失败归因完全不同，混在一起会互相
  #   淹没。
  #
  # 守的是 apps/README.md §写应用时必须守的几条 —— 那几条的共同点是「违反了不会
  #   报错，只会静默失效」。其中**快照子节点**运行期判不出来（实测：{sig()} 求值
  #   成字符串后，与手写字面量在类型上无法区分 —— gui-guide §8.1 因此写下"这条
  #   只能靠纪律，不能靠工具兜底"），只有静态分析看得到源码里那是一次调用。
  #   gox lint 用 Gox 自己的 parser 做这件事，不引入任何外部 JS 解析器依赖。
  app-lint:
    name: apps/ 静默陷阱 lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gox lint apps
        run: |
          set -euo pipefail
          # 守卫自身也要有守卫 —— 而且必须跑在 lint 之前。一条永远输出 "ok"
          # 的规则比没有规则更糟：它给人虚假的安全感（apps/ 跑一遍零命中，
          # 既可能是代码干净，也可能是规则已经死了）。每条规则都配了"正确写法
          # 不许误报"的反例，误报是 lint 的头号死因。
          if ! go test ./cmd/gox/ -run 'TestLint' -count=1; then
            echo "::error::gox lint 自测未通过 —— 规则或负向样本失效，它可能已经不再拦任何东西"
            exit 1
          fi
          if ! go run ./cmd/gox lint apps; then
            echo "::error::apps/ 命中静默陷阱规则 —— 文件与行号见上一条输出；四条规则全部出自 apps/README.md §写应用时必须守的几条"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 鸿蒙侧 Go 代码的编译期类型检查（补三端覆盖里最后那个洞）
  #
  # 为什么需要它：Android 有 APK 打包冒烟、iOS 有模拟器编译（都在 mobile-smoke
  # 里），**鸿蒙是三端里唯一零 CI 覆盖的一端** —— 托管 runner 装不了 DevEco
  # SDK（华为镜像只有设备 L2 SDK，hf-mirror 拉不通），于是改 gfx/harmony 下的
  # Go 代码在 CI 上**完全没有反馈**，错了只能等本地有 Windows + DevEco 的人
  # 手工编一次。这不是"懒得配"，是环境限制。
  #
  # 但"编不了"和"查不了"是两件事：鸿蒙 Go 侧的 C 依赖只有 node_api.h（34 个
  # napi_* 全是 Node-API 标准符号）与 hilog/log.h（就几个符号）。拿真 Node 的
  # node_api.h + 一个 hilog 替身头文件，就能在 ubuntu runner 上把鸿蒙侧完整
  # 编译一遍 —— 含全部 cgo 的 C 代码。头文件来源与许可见
  # scripts/harmony-typecheck/README.md。
  #
  # ⚠️ 边界（写在作业里，免得被当成真机验证）：这是**编译期类型检查**，不是
  # 真机构建。链接层的 OHOS 库（libace_napi.z.so）与运行时行为一律不验；产物
  # 是宿主 x86-64 的 .so，**不可用于鸿蒙设备**（脚本末尾有 ELF 机器码断言挡着）。
  # 真机验收仍走 scripts/mobile-device-accept.sh 与本地 DevEco。
  #
  # 为什么放 ci.yml 而不是 mobile-smoke.yml：mobile-smoke 的触发器只有
  # `push: main` + workflow_dispatch，**PR 上不跑** —— 而"PR 改了鸿蒙代码却没
  # 反馈"正是要修的那个洞。本作业在 ubuntu 上跑、一分钟量级，适合进 PR 闸门。
  # ─────────────────────────────────────────────────────────────────────────────
  harmony-typecheck:
    name: 鸿蒙 Go 侧编译期类型检查（桌面, 非真机）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ubuntu runner 自带 gcc（cgo 要真的过一遍 C 编译器）；显式确认一次，
      # 免得 runner 镜像变了以后作业以"跳过 C 编译"的方式静默变绿。
      - name: 确认 C 编译器在场
        run: |
          set -euo pipefail
          command -v cc || command -v gcc || { echo "::error::找不到 C 编译器 —— 鸿蒙类型检查需要它跑 cgo"; exit 1; }
          cc --version | head -1

      - name: 鸿蒙类型检查（vet + c-shared 编译）
        run: |
          set -euo pipefail
          if ! bash scripts/check-harmony.sh 2>&1 | tee harmony-typecheck.log; then
            echo "::error::鸿蒙侧类型检查未通过 —— 末尾 20 行如下（完整日志在步骤日志里）"
            tail -20 harmony-typecheck.log | while IFS= read -r l; do echo "::error::${l:0:500}"; done
            exit 1
          fi

      # 产物是宿主架构的 .so，**绝不归档** —— 归档就等于给人发一份"看起来像鸿蒙
      # 产物、实际装不上"的东西。这里只留日志。
      - name: 归档检查日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-typecheck-log
          path: harmony-typecheck.log
          if-no-files-found: ignore

  # ── gfx 属性/事件白名单 golden（看板 rgQsDD）────────────────────────────────
  # 为什么单独一个作业：它是「Go AST 抽取 → Python 合成 → JSON 比对」三段式，
  #   失败归因与注册表（纯文本）、init-purity（Go AST）都不同；而且它要 Go
  #   工具链（跑 tools/propdump），与纯 Python 的 registries 不该绑在一条里。
  #
  # 守的是 docs/props.golden.json 与 gfx 的**读取点**同步：新增/删除一个属性
  #   读取点而没更新 golden，dev 模式的"未注册属性"警告就会白报（或漏报），
  #   而白名单一旦失信，strictAPI 就会被整体关掉 —— 那本单就白做了。
  #
  # 与 r3FFt6 的导出名单 golden 同一哲学：CI 只 diff，**不自动刷新** ——
  #   自动刷新等于把 API 变化藏起来，golden 就退化成一份永远与代码一致的冗余文件。
  props-golden:
    name: 属性/事件白名单 golden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 实抽 vs docs/props.golden.json
        run: |
          set -euo pipefail
          if ! python3 scripts/gen-props-golden.py --check; then
            echo "::error::属性白名单 golden 与代码不一致 —— 差在哪一组（标签/属性）见上一条输出；确认无误后本地跑 python3 scripts/gen-props-golden.py 重新生成并随代码一起提交"
            exit 1
          fi

  # ── WCAG 对比度闸门（Prism S2）──────────────────────────────────────────────
  # 为什么单独一个作业：它是**纯计算**（gfx/contrast.go 只用标准库），既不要
  #   xvfb 也不要字体，更不需要三平台矩阵 —— 塞进 build-test 会让它为了几条
  #   算术白等三个 runner 各装一遍apt 依赖；而失败的归因也完全不同：这里红了
  #   是"某个色的对比度掉到阈值下"，不是"某个平台画不出来"。
  #
  # 守的是 docs/accessibility.md §9 那份承诺：prism-light / prism-dark 的每一条
  #   文字与控件边界配对都过 WCAG 2.1 AA。色值一旦被为了"好看"调浅，这里立刻
  #   红，且错误信息里直接给实测比值与两个色值 —— 不需要先翻 WCAG 才知道动到
  #   了哪条契约。
  #
  # 只跑 -run 'TestContrast'：这条闸门要在 1 分钟内给出答案，不能让 gfx 包里
  #   那批窗口 / 字体用例（需要 X server 与 Noto CJK）把它拖进 xvfb 的世界。
  contrast:
    name: WCAG 对比度断言（prism-light / prism-dark）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 不写 check-latest: true（全仓刻意如此）：见 build-test 的同款注释 ——
      # 工具链漂移会让字节级 golden 无意义地红一轮。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: WCAG 对比度断言
        run: go test ./gfx/ -run 'TestContrast' -count=1 -v

  build-test:
    name: 编译 / vet / 测试 (${{ matrix.os }})
    # 三平台矩阵 (T02)：Gox 的三个桌面后端各守一个平台 —— win32 / cocoa / x11。
    # 此前测试只钉 windows（当年 Linux 无头行为未验证）；现在 x11 用例的期望值
    # 修正 + xvfb 实测全绿之后，ubuntu/macos 正式入列。fail-fast 关掉，让三个
    # 平台的红互不掩盖 —— 平台相关用例一次看全。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # 子模块已全部摘除（npm/website 等是独立仓库，测试矩阵不读它们），
      # 普通 checkout 即可。
      - uses: actions/checkout@v4

      # 不写 check-latest: true：测试里有字节级 golden 比对（icongen），
      # PNG 压缩输出随 Go 补丁版本变化 —— CI 的工具链必须与刷新 golden 时用的
      # go.mod 版本完全一致，否则每次 Go 发补丁版 ci 就会无意义地红一轮。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      # 零 cgo 是硬约束，所以 -race 在本项目不可用（Go 会要求 cgo 支持），
      # 这里也就没有 -race 这一档。
      #
      # Linux 无头闸门 (xvfb)：x11 后端经 jezek/xgb 走纯 Go 的 X11 协议（零 cgo，
      # 不需要 libx11-dev），但有一批用例需要真的连上一个 X server —— xvfb
      # 就是那个"有 X 协议、没有显示器"的最小宿主。fonts-dejavu 是字体测量类
      # 用例的兜底（runner 裸机可能一个字体都没有）。
      #
      # fonts-noto-cjk 是**必须**的（2026-10-01 补）：DejaVu 是纯拉丁字体，没有
      # 任何汉字字形，于是 CJK 度量/字形缓存类用例 (TestMeasureText /
      # TestGlyphCacheRepeatedRuneIdentical 等) 在 ubuntu 上量出的宽度全按
      # "缺字形" 的占位宽度走，断言必然红 —— 这正是当天三平台 ci 里 ubuntu
      # 那条的根因。装上 Noto CJK 之后这些用例在 Linux 上真正被执行，
      # 与 Windows / macOS 口径一致，同时 requireCJKFont 的跳过兜底仍然保留
      # （万一将来 runner 镜像变动导致字体缺失，是 Skip 而不是红）。
      - name: go test ./... (linux + xvfb 无头 X)
        if: runner.os == 'Linux'
        run: |
          # 证据纪律（看板 rXrGfu）：本条从 2026-10-02 起持续红，而 check-run 注解
          # 只有一句 Process completed with exit code 1.（未登录读不到 job 日志）
          # ⇒ 必须自己把「失败包 + 失败用例名」写成 ::error:: 注解，否则无法归因。
          # 顺带打 go version —— Go 补丁版漂移会改变 golden 字节比对结果。
          set +e
          log="$(mktemp)"
          (
            set -e
            echo "===== go version ====="; go version
            echo "===== apt-get update ====="; sudo apt-get update -q
            echo "===== apt-get install ====="; sudo apt-get install -yq xvfb fonts-dejavu-core fonts-noto-cjk
            echo "===== xvfb-run go test ./... ====="
            GOX_SHOTS_STATS=1 xvfb-run -a -s "-screen 0 1280x800x24" go test ./...
          ) >"$log" 2>&1
          rc=$?
          echo "---- 原始输出尾部（末 60 行）----"
          tail -n 60 "$log"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          failpkgs="$(grep -aE '^FAIL[[:space:]]' "$log" | awk '{print $2}' | sort -u | tr '\n' ',' | cut -c1-600)"
          failtests="$(grep -aE '^[[:space:]]*--- FAIL:' "$log" | sed -E 's/^[[:space:]]+//' | tr '\n' ';' | cut -c1-900)"
          sigcount="$(grep -acE 'panic:|fatal error:|test timed out|DATA RACE' "$log")"
          echo "::error::linux/xvfb go test 失败 rc=${rc}｜失败包=[${failpkgs:-（无 FAIL 行，可能红在 apt 或构建期）}]｜失败用例=[${failtests:-（无 --- FAIL 行）}]｜panic或超时命中=${sigcount}"
          # 注解散布在几条上：一条塞满会顶到注解长度上限，而定位靠的正是这些数值。
          failmsg="$(grep -aE '_test\.go:[0-9]+:' "$log" | grep -av '非底色像素' | sed -E 's/^[[:space:]]+//' | tr '\n' '|' | cut -c1-1200)"
          # 画廊/测量类用例的**实测**统计：跨平台阈值漂移必须拿数字说话，不能靠猜。
          gstats="$(grep -aE '非底色像素' "$log" | sed -E 's/^[[:space:]]+//' | tr '\n' '|' | cut -c1-1600)"
          echo "::error::linux/xvfb 断言明细=[${failmsg:-（无 _test.go 行）}]"
          if [ -n "$gstats" ]; then echo "::error::linux/xvfb 画廊实测=[${gstats}]"; fi
          exit "$rc"

      # 证据纪律（看板 rXrGfu，2026-10-07 补）：本步曾在 macos-latest 上持续红，
      # 而 check-run 注解只有 `Process completed with exit code 1.`（未登录读不到
      # job 日志）⇒ 与 Linux 那条同款处理：自己把「失败包 + 失败用例名 + 断言明细」
      # 写成 ::error:: 注解，否则永远无法归因。Windows/macOS 都要能自证。
      - name: go test ./...
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set +e
          log="$(mktemp)"
          (
            set -e
            echo "===== go version ====="; go version
            echo "===== go test ./... (${{ runner.os }}) ====="
            go test ./...
          ) >"$log" 2>&1
          rc=$?
          echo "---- 原始输出尾部（末 60 行）----"
          tail -n 60 "$log"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          failpkgs="$(grep -aE '^FAIL[[:space:]]' "$log" | awk '{print $2}' | sort -u | tr '\n' ',' | cut -c1-600)"
          failtests="$(grep -aE '^[[:space:]]*--- FAIL:' "$log" | sed -E 's/^[[:space:]]+//' | tr '\n' ';' | cut -c1-900)"
          sigcount="$(grep -acE 'panic:|fatal error:|test timed out|DATA RACE' "$log")"
          echo "::error::${{ runner.os }} go test 失败 rc=${rc}｜失败包=[${failpkgs:-（无 FAIL 行，可能红在构建期）}]｜失败用例=[${failtests:-（无 --- FAIL 行）}]｜panic或超时命中=${sigcount}"
          failmsg="$(grep -aE '_test\.go:[0-9]+:' "$log" | grep -av '非底色像素' | sed -E 's/^[[:space:]]+//' | tr '\n' '|' | cut -c1-1200)"
          gstats="$(grep -aE '非底色像素' "$log" | sed -E 's/^[[:space:]]+//' | tr '\n' '|' | cut -c1-1600)"
          echo "::error::${{ runner.os }} 断言明细=[${failmsg:-（无 _test.go 行）}]"
          if [ -n "$gstats" ]; then echo "::error::${{ runner.os }} 画廊实测=[${gstats}]"; fi
          exit "$rc"

      - name: 冒烟：命令行能起来并报版本号
        run: |
          go build -o dist/ci-gox${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/gox
          ./dist/ci-gox${{ runner.os == 'Windows' && '.exe' || '' }} version

  # ─────────────────────────────────────────────────────────────────────────
  # 折叠屏形态矩阵回归（看板单 rSm7zW / S4 / N4）
  #
  # build-test 的 go test ./... 其实**已经覆盖**了下面这些用例；这个 job 存在的
  # 理由是把「形态矩阵」钉成一条**独立 check**：形态回归红的时候，check 名直接
  # 告诉你是折叠屏的事（而不是淹没在全量测试的几十页日志里），并且分支保护
  # 可以单独把它标 required（「失败即阻断合并」是仓库设置，代码里写不了，
  # 这个 job 的 job key 就是要挂进 required 的名字）。
  #
  # 覆盖的矩阵（全部走 fake surface，不需要真设备）：
  #   · TestFoldableDemoDeviceMatrix        折叠屏 demo 四档形态回放
  #   · TestFoldLifecycleEventOrder20Rounds 折叠 × 前后台 20 轮事件顺序
  #   · TestBackPressUnhandledSemantics     返回键三分支语义
  #   · TestReadmeAdaptiveListDemoColumns   README 首屏示例 4 档宽度断言
  #   · TestPermission*                     权限三端口径矩阵
  # 真机侧的「adb 折叠态切换 + simctl 机型矩阵」在 mobile-smoke.yml
  # （android-fold-emulator / ios-device-matrix 两个 job）——那边才能动设备。
  # ─────────────────────────────────────────────────────────────────────────
  foldable-matrix:
    name: 折叠屏形态矩阵回归 (S4/N4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 形态矩阵 / 生命周期 / 自适应示例 / 权限矩阵
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # fonts-noto-cjk 是必需的（与 build-test 同一条理由：demo 里是中文，
          # 缺字体会让文本走缺字形占位，断言可能失真）。
          sudo apt-get install -yq xvfb fonts-dejavu-core fonts-noto-cjk
          xvfb-run -a -s "-screen 0 1280x800x24" go test ./gfx/ -count=1 -v \
            -run 'TestFoldableDemoDeviceMatrix|TestFoldLifecycleEventOrder20Rounds|TestBackPressUnhandledSemantics|TestReadmeAdaptiveListDemoColumns|TestPermission'
