# 打 v* tag 时自动发布 npm 包：交叉编译全平台二进制 → 校验版本 → npm publish。
# 发布认证（二选一，npm CLI 优先 OIDC、失败回落 token）：
#   A. Trusted Publishing（推荐，免 token）：npmjs.com 账号设置里为本包添加
#      trusted publisher（org/user: 14752222, repo: Gox, workflow: release.yml）
#   B. 传统 token：npmjs.com → Access Tokens 创建 Granular 类型、Read and write、
#      勾选 All packages（新包名必须），在仓库 Secrets 里配置为 NPM_TOKEN
# 发版流程：改 npm/package.json 的 version → 提交 → 打 tag（如 v0.1.0）→ push tag
name: release

on:
  push:
    tags: ['v*']

# id-token: write 是 npm Trusted Publishing (OIDC) 鉴权所必需
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) 需要 npm >= 11.5.1，Node 22 自带的是 10.x
      - run: npm install -g npm@latest

      - name: Check version matches tag
        run: |
          PKG_VER=$(node -p "require('./npm/package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "npm/package.json 版本 ($PKG_VER) 与 tag ($TAG_VER) 不一致，请先同步版本号" >&2
            exit 1
          fi

      - run: bash ./scripts/build-npm.sh

      - name: Publish
        run: cd npm && npm pack --dry-run && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
