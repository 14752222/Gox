# ─────────────────────────────────────────────────────────────────────────────
# @goxjs/goxjs 发版流水线：交叉编译五平台二进制 → 打包 → 发布到 npm
#
# 触发条件（四种入口，全部汇入同一个幂等作业）：
#   * push 到 main      —— 每次推送都会判断一次，但只有 npm/package.json 的版本号
#                          在 registry 上还不存在时才真发布；日常提交的代价
#                          只是十几秒的判重
#   * push 标签 v*      —— 版本号以标签为准，且必须与 npm/package.json 一致
#   * Release published —— 以 Release 的 tag 为准，同样要求两者一致
#   * workflow_dispatch —— 手动触发，可勾 dry_run 只构建打包、不上传
#
# 幂等：先查 registry，该版本已存在 → 跳过（exit 0 + notice）。所以重复推送、
#       重跑历史工作流、补跑失败的发版都不会报红，也不会误发。
#       注：本工作流在 push main 成功后用 gh（GITHUB_TOKEN）建 Release —— 这**不会**
#       再触发一次工作流运行（GitHub 规定 token 发起的事件不自激）；人工在界面上
#       发布的 Release 才会触发，那一次会因判重命中而直接以 notice 跳过。
#
# 认证：npm Trusted Publishing (OIDC)，不需要任何 secret / token。
#   npmjs.com → 该包 Settings → Trusted Publisher 四个字段必须逐字符相等：
#     Organization or user = 14752222
#     Repository           = Gox        ← 大写 G，npm 做大小写敏感的精确匹配
#     Workflow filename    = release.yml
#     Environment name     = （留空，本工作流没有 environment:）
#   失配的症状是**误导性的 404**，不是 403。
#   另：本工作流里不得出现 NODE_AUTH_TOKEN / registry-url —— .npmrc 里的 token
#   会压过 OIDC 自动检测，让 npm 继续走旧凭据，最终也是那个 404。
#
# 打包布局（2026-09-20 踩坑后的定论）：二进制先编到 dist/npm/binaries/，再复制进
#   npm/binaries/ 打包，发完即删。原因是 npm 在包目录里找不到 .npmignore 时会回退
#   读仓库根的 .gitignore，被它忽略的目录即使写在 package.json 的 files 里也进不了
#   包 —— 会发出一个没有二进制的空壳包（本地 Windows 不复现、Linux CI 上必现）。
#   所以：产物不进包目录、包目录里放占位 .npmignore、.gitignore 里不写 npm/ 下路径。
#
# 移动端（M11）：走**独立的平台子包** @goxjs/goxjs-mobile-<platform>-<abi>，
#   不塞进主包（那会把每个桌面用户从 ~20MB 顶到 ~72MB）。子包定义在
#   npm/packages/<dirname>/package.json（committed），产物由
#   scripts/build-npm-mobile.sh staging 到 dist/npm-mobile-pkgs/<dirname>/，
#   每个子包在各自 runner 上整包生成（含 manifest.json），publish 阶段逐个发布。
#   三个移动平台里只有 android（NDK，ubuntu 可编）与 ios（Xcode，macos 专属作业）
#   进 CI；harmony 需要 DevEco SDK，托管 runner 装不了 —— 见 mobile-ios 作业注释。
#   ⚠️ 每个子包都要在 npmjs.com 上单独配 Trusted Publishing（同一组 org/repo/workflow）。
#
# 桌面签名 / 公证（r8ErgP）：同一条流水线上的**可选增强**，配了 secrets 才生效，
#   缺凭证一律优雅跳过（::notice:: 说明原因，不阻塞发布）：
#   * Windows —— publish 作业里用 osslsigncode 给 npm/binaries/windows-x64/gox.exe
#     做 Authenticode 签名（纯 OpenSSL 实现，签 PE 与宿主平台无关，所以不必为盖章
#     再开一个 windows runner；缺 WINDOWS_PFX_BASE64 则跳过）；
#   * macOS —— sign-macos 作业（npm 包里的 darwin 二进制，必须赶在 npm pack 之前）
#     与 universal 作业（Release Assets 的三个 darwin 产物）共用
#     scripts/sign-macos.sh 走 codesign → notarytool → stapler
#     （缺 MACOS_CERT_P12_BASE64 则整个作业跳过，publish 用自己编的未签名产物）。
#   判空与「为什么跳过」集中在 scripts/check-signing-creds.sh（三处调用同一份判据），
#   跳过逻辑有没有被改坏由 scripts/check-signing-workflow.py 静态校验（ci.yml 里跑）。
#
# 发版动作：改 npm/package.json 的 version（子包版本须同号）→ 提交 → push 到 main
#           （或打 tag），registry 上出现带 provenance 证明的新版本即成功。
# ─────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建 + 打包校验，不真正上传 npm
        type: boolean
        default: false

permissions:
  contents: write # push 到 main 成功后自动打 tag / 建 Release
  id-token: write # 换取 npm 的 OIDC 发布凭据，必需

# 发版是串行资源：tag 推送与 main 推送可能同时到达，排队而不是并行
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  decide:
    name: 判重（版本号 vs registry）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      # npm/ 等目录是独立仓库的子模块，判重与打包都要读到里面的 package.json。
      - uses: actions/checkout@v7
        with:
          submodules: true

      # ── 版本号闸门（r4yycE，B 路：维持手写，但把检查升级成发版硬闸门）────────
      # 放在 decide 的**第一步**：发版一旦走到 publish，二进制已经交叉编译完了，
      # 那时才发现版本号对不上，浪费的是整轮构建；而这里几秒就能判死。
      #
      # 为什么不用「收敛到 git tag / ldflags 注入」（A 路）：cmd/gox/main.go 的注释
      #   已经写明「刻意不引入第二个真相来源以外的复杂度」—— 那是有意取舍。
      #   所以本单不改架构，只把"漏改"从「事后被 check-registries 发现」前移成
      #   「发版第一关就红」，并且失败时把每一处真相点的 文件:行号 = 值 全列出来：
      #   只报一句"版本号不一致"等于让人去全仓 grep，那是 rXrGfu 的老毛病。
      #
      # 覆盖范围：cmd/gox/main.go 的 const version（基准）+ npm/package.json +
      #   npm/packages/* 平台子包。官网页面里的版本号由 pages.yml 的
      #   scripts/check-site.py 那一步负责（部署时），不在这里重复建闸。
      #
      # `--github` 让脚本自己把失败写成 ::error:: 注解：未登录读不到 job 日志，
      #   而注解是唯一的归因入口。
      - name: 版本号同步闸门（cmd/gox ↔ npm 主包 ↔ 平台子包）
        run: |
          set -euo pipefail
          python3 scripts/check-registries.py --version --github

      - name: 解析版本号并查 registry
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # 历史标签（v0.1.0 / v0.1.1）指向的是包定义纳入仓库之前的提交
          if [ ! -f npm/package.json ]; then
            echo "::notice::$REF_NAME 里没有 npm/package.json（早于包定义纳入仓库），跳过"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PKG_NAME=$(node -p "require('./npm/package.json').name")
          PKG_VER=$(node -p "require('./npm/package.json').version")
          echo "包名 $PKG_NAME ，package.json 版本 $PKG_VER"

          if [ "$PKG_NAME" != "@goxjs/goxjs" ]; then
            echo "::notice::包名是 $PKG_NAME 而不是 @goxjs/goxjs（改名前的历史标签），跳过"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 标签 / Release 事件以 ref 上的版本为准，且必须与文件里的版本一致
          case "$EVENT" in
            push)
              if [ "${REF#refs/tags/}" != "$REF" ]; then
                VER="${REF_NAME#v}"
                if [ "$VER" != "$PKG_VER" ]; then
                  echo "::error::标签 $REF_NAME 与 npm/package.json 的 $PKG_VER 不一致，发版前先同步版本号"
                  exit 1
                fi
              else
                VER="$PKG_VER"
              fi
              ;;
            release)
              VER="${RELEASE_TAG#v}"
              if [ "$VER" != "$PKG_VER" ]; then
                echo "::error::Release tag $RELEASE_TAG 与 npm/package.json 的 $PKG_VER 不一致"
                exit 1
              fi
              ;;
            *)
              VER="$PKG_VER"
              ;;
          esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # 判重：查到该版本 = 已发布；查不到但包本身在 = 版本确实没发过；
          # 两者都查不到 = 网络抖了，重试（别把网络故障误判成"没发过"而重复发布）
          exists=no
          for attempt in 1 2 3 4 5; do
            if npm view "$PKG_NAME@$VER" version >/dev/null 2>&1; then
              exists=yes; break
            fi
            if npm view "$PKG_NAME" version >/dev/null 2>&1; then
              exists=no; break
            fi
            echo "registry 查询失败（第 $attempt 次），3s 后重试"
            sleep 3
          done

          if [ "$exists" = yes ]; then
            echo "::notice::$PKG_NAME@$VER 已在 registry 上，跳过发布"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::准备发布 $PKG_NAME@$VER"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: 构建并发布
    # mobile-ios 先生成 iOS 平台子包（macOS 专属工具链），本作业下载后与 android
    # 子包一起发布 —— 单一 runner 编不出全部移动端目标。
    # sign-macos 同理：darwin 二进制要在 macOS 上签名/公证，签完以 artifact 交回来，
    # 所以本作业必须等它（它因缺凭证跳过时 result=skipped，这里照常往下走）。
    needs: [decide, mobile-ios, sign-macos]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # npm/ 等目录是独立仓库的子模块，判重与打包都要读到里面的 package.json。
      - uses: actions/checkout@v7
        with:
          submodules: true

      # 发版前的第一道闸门：注册表 / 版本号静态一致性（与 ci.yml 同一份判据）。
      # 必须放在这里，因为 tag 推送、Release 发布、workflow_dispatch 这三条入口
      # 都不会经过 ci.yml，但它们同样会把包推到 npm。
      - name: 注册表一致性（内置组件 / gx 模块 / 版本号 / npm 清单）
        run: |
          set -euo pipefail
          # --github：让脚本把每条失败自己写成 ::error:: 注解（带具体文件与缺哪个
          # 站点）。上面 decide 已经用 --version 单独跑过版本号，这里跑全套。
          python3 scripts/check-registries.py --github

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # 故意不写 registry-url：它会让 setup-node 往 .npmrc 里塞一行
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} 占位符，npm 会据此
      # 认为"用户要走 token 认证"从而跳过 OIDC 交换，最终以那个 404 收场。
      # 默认 registry 本来就是 npmjs.org，不写这一行没有任何损失。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Trusted Publishing 需要 npm >= 11.5.1，而 Node 22 自带的是 10.x
      - name: 升级 npm
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"
          NPM_MAJOR=$(npm --version | cut -d. -f1)
          if [ "$NPM_MAJOR" -lt 11 ]; then
            echo "::error::npm $NPM_MAJOR 过低，OIDC 发布需要 >= 11.5.1"
            exit 1
          fi

      # 产物先落在 dist/npm/binaries/，再复制一份进包目录（发布后由最后一步清掉）
      - name: 交叉编译五平台二进制并放进包目录
        run: bash ./scripts/build-npm.sh --into-package

      # ── 桌面签名（r8ErgP）：Windows Authenticode ────────────────────────────
      # 为什么签在这一步：windows 产物就是上一步在**这台 ubuntu runner** 上交叉编译
      #   出来的，而 npm pack 在很后面 —— 盖章必须卡在两者之间，否则发出去的包里
      #   还是未签名那份。osslsigncode 是纯 OpenSSL 实现，签 PE 与宿主平台无关
      #   （electron-builder 就是这么在 Linux 上签 Windows 包的），所以不用为一次
      #   盖章再开一个 windows runner 来回传产物。
      #
      # 缺 WINDOWS_PFX_BASE64 → 优雅跳过 + ::notice::，发布照跑：桌面签名是
      #   「配了凭证才生效」的增强项，不能反过来成为发版硬门槛（否则凭证一丢就发不出去了）。
      # 配了凭证却签失败 → 判红：静默发出未签名包比发不出更糟。
      - name: 探测 Windows 签名材料
        id: win-cred
        env:
          # 判空在 YAML 侧做：GitHub 未配置的 secret 求值为空串，只有表达式能区分
          # 「没配」与「配了空串」；把值传进探测脚本只会让凭证多一次暴露机会。
          HAS_WIN_PFX: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        run: bash scripts/check-signing-creds.sh windows

      - name: Windows Authenticode 签名（npm/binaries/windows-x64/gox.exe）
        if: steps.win-cred.outputs.enabled == 'true'
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          # osslsigncode 不在 ubuntu 镜像里，装它比换 runner 便宜
          sudo apt-get update -qq
          sudo apt-get install -y osslsigncode
          command -v osslsigncode
          # base64 → 文件的动作在脚本内完成（600 + 用完即删），这里只把 secret 交给它
          bash scripts/sign-windows.sh npm/binaries/windows-x64/gox.exe

      # ── macOS 签名产物回灌（r8ErgP）─────────────────────────────────────────
      # sign-macos 作业在 macos runner 上编 + 签 darwin 二进制，这里用签过的那份
      # 换掉包内产物 —— npm 是 macOS 用户的主要安装渠道，Gatekeeper 拦的正是它。
      # 作业因缺凭证跳过时 result=skipped → 两步都不跑，继续用本作业编的未签名产物。
      # 判据用 sign-macos 的**作业输出**而不是 `result == 'success'`：缺凭证时那个
      # 作业照样跑完（只是内部步骤全跳过、不传 artifact），result 也是 success ——
      # 拿 result 判会让本作业去下一个不存在的 artifact，反而把发布搞挂。
      - name: 下载 macOS 签名产物
        if: needs.sign-macos.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gox-darwin-signed
          path: dist/darwin-signed

      - name: 用签名后的 darwin 二进制替换包内产物
        if: needs.sign-macos.outputs.signed == 'true'
        run: |
          set -euo pipefail
          for d in darwin-x64 darwin-arm64; do
            SRC="dist/darwin-signed/$d/gox"
            if [ ! -f "$SRC" ]; then
              echo "::error::sign-macos 成功了但缺少 $SRC；证据：$(ls -laR dist/darwin-signed 2>&1 | head -20)"
              exit 1
            fi
            cp "$SRC" "npm/binaries/$d/gox"
            chmod +x "npm/binaries/$d/gox"   # artifact 不保留可执行位
            ls -lh "npm/binaries/$d/gox"
          done

      # ── 移动端「平台子包」（M11）───────────────────────────────────────────
      # 移动端按「平台 × ABI」拆成独立子包 @goxjs/goxjs-mobile-<platform>-<abi>，
      # 不再塞进主包（那会把每个桌面用户从 ~20MB 顶到 ~72MB）。产物落在
      # dist/npm-mobile-pkgs/<dirname>/，每个子包在该 runner 上**整包生成**
      # （package.json + 产物 + manifest.json），无需跨 runner 重扫清单。
      #   android 在本 runner 编（镜像自带 NDK，与 mobile-smoke.yml 同一姿势）；
      #   ios 由上面的 mobile-ios 作业产出（c-archive 只能在 macOS 上编），下载后
      #       原样落到 dist/npm-mobile-pkgs/（目录名不冲突）；
      #   harmony 不在 CI：要 DevEco SDK 的 clang+sysroot，托管 runner 装不了。
      - name: 断言子包定义已同步（packaging/npm-mobile/ → npm/packages/）
        run: |
          set -euo pipefail
          # 单一真源在主仓 packaging/npm-mobile/<dirname>/metadata.json；
          # npm/packages/ 下的 package.json 是生成物。发出去的身份必须与定义一致。
          python3 scripts/gen-npm-mobile-pkgs.py --check

      - name: 交叉编译 android 平台子包
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::找不到 Android NDK（ANDROID_HOME=$ANDROID_HOME）—— runner 镜像变了？"
            exit 1
          fi
          echo "==> NDK: $ANDROID_NDK_HOME"
          bash ./scripts/build-npm-mobile.sh --platform android --abi arm64-v8a

      - name: 下载 iOS 平台子包
        uses: actions/download-artifact@v4
        with:
          name: gox-mobile-ios-pkgs
          path: dist/npm-mobile-pkgs

      - name: 校验移动端子包（结构 + manifest sha256）
        run: |
          set -euo pipefail
          if ! python3 scripts/check-registries.py; then
            echo "::error::移动端子包自洽检查未通过（命名 / 版本 / manifest sha256）"
            exit 1
          fi
          ls -lhR dist/npm-mobile-pkgs

      - name: 校验二进制齐全
        run: |
          set -euo pipefail
          for d in darwin-x64 darwin-arm64 linux-x64 linux-arm64 windows-x64; do
            BIN="npm/binaries/$d/gox"
            if [ "$d" = windows-x64 ]; then BIN="$BIN.exe"; fi
            if [ ! -f "$BIN" ]; then
              echo "::error::缺少 $BIN"
              exit 1
            fi
            ls -lh "$BIN"
          done
          echo "── 移动端子包 ──"
          for d in goxjs-mobile-android-arm64-v8a \
                   goxjs-mobile-ios-iphoneos-arm64 \
                   goxjs-mobile-ios-iphonesimulator-arm64; do
            if [ ! -f "dist/npm-mobile-pkgs/$d/manifest.json" ]; then
              echo "::error::缺少 dist/npm-mobile-pkgs/$d/manifest.json"
              exit 1
            fi
            ls -lh "dist/npm-mobile-pkgs/$d/"
          done

      - name: 校验构建来源元数据（commit / 脏树）
        # rFf4lR: release 产物必须能 `go version -m` 读到 vcs.revision, 且
        # vcs.modified 不为 true —— 否则这份产物无法唯一定位源码, 线上出问题时
        # 也复现不了。失败原因逐条写进 ::error::, 不留一个裸 exit code 让人猜。
        #
        # 背景: Go 默认 -buildvcs=true 已经把元数据嵌进二进制, 缺口从来不是
        # "二进制没有元数据", 而是没人校验它、也没人把它交给使用者。
        run: |
          set -euo pipefail
          FAILED=0
          for d in darwin-x64 darwin-arm64 linux-x64 linux-arm64 windows-x64; do
            BIN="npm/binaries/$d/gox"
            if [ "$d" = windows-x64 ]; then BIN="$BIN.exe"; fi
            if [ ! -f "$BIN" ]; then
              echo "::error::缺少 $BIN"
              FAILED=1
              continue
            fi
            M=$(go version -m "$BIN" 2>/dev/null || true)
            REV=$(printf '%s\n' "$M" | awk '/vcs[.]revision=/{sub(/.*vcs[.]revision=/,"");print;exit}')
            MOD=$(printf '%s\n' "$M" | awk '/vcs[.]modified=/{sub(/.*vcs[.]modified=/,"");print;exit}')
            if [ -z "$REV" ]; then
              echo "::error::$BIN 无 vcs.revision(未带来源元数据, 发布后无法定位提交)"
              FAILED=1
              continue
            fi
            if [ "$MOD" = "true" ]; then
              echo "::error::$BIN 由脏工作树构建(vcs.modified=true), 禁止发布"
              FAILED=1
              continue
            fi
            echo "  $BIN -> $REV"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::构建来源元数据校验未通过: release 产物必须带 vcs.revision 且不得由脏树构建"
            exit 1
          fi

      - name: 校验 gox version 能唯一确定工作树
        # 同一条的两个出口: 二进制元数据要能被人读到, 不能只活在 `go version -m`
        # 里。`gox version` 必须打印 commit, 且不得标 dirty。
        run: |
          set -euo pipefail
          OUT=$(./npm/binaries/linux-x64/gox version)
          echo "$OUT"
          echo "$OUT" | grep -Eq '^commit  [0-9a-f]{40}$' || {
            echo "::error::gox version 未打印 40 位 commit(无法唯一定位工作树)"
            exit 1
          }
          echo "$OUT" | grep -q 'dirty' && {
            echo "::error::gox version 标了 dirty, 产物由脏工作树构建"
            exit 1
          }
          echo "  gox version 身份输出 OK"

      - name: 冒烟测试（跑打包后的入口，而不是裸二进制）
        run: |
          set -euo pipefail
          printf 'console.log("goxjs smoke:", [1, 2, 3].map(v => v * 2).join(","));\n' > /tmp/smoke.js
          OUT=$(node npm/bin/gox.js /tmp/smoke.js)
          echo "$OUT"
          echo "$OUT" | grep -q '2,4,6' || { echo "::error::冒烟测试输出不符"; exit 1; }

      - name: 打包校验（发布前的最后一道闸）
        run: |
          set -euo pipefail
          cd npm

          # tarball 名由包名 + 版本推导，不去解析 npm 的 stdout（各版本输出格式不同；
          # 上一版 `npm pack --dry-run --json | node` 就是死在这里，且没留下可读信息）。
          # pack 目标用**相对路径**：Windows 的 Git Bash 里 /tmp 不会被转换，npm 会把包
          # 写到别处、后面 tar 找不到（本地实测踩到）。dist/ 已在 .gitignore 中。
          NAME=$(node -p "require('./package.json').name.replace(/^@/, '').replace('/', '-')")
          VERSION=$(node -p "require('./package.json').version")
          DEST="../dist/npm-pack"
          mkdir -p "$DEST"
          rm -f "$DEST/$NAME-$VERSION.tgz"

          npm pack --pack-destination "$DEST"
          TARBALL="$DEST/$NAME-$VERSION.tgz"
          if [ ! -f "$TARBALL" ]; then
            echo "::error::npm pack 没有产出 $TARBALL ，看上面的 pack 输出"
            ls -lh "$DEST" || true
            exit 1
          fi
          ls -lh "$TARBALL"

          CONTENT=$(tar -tzf "$TARBALL" | sort)
          echo "包内容："
          echo "$CONTENT"

          missing=""
          for want in package/package.json package/bin/gox.js package/README.md \
                      package/binaries/linux-x64/gox package/binaries/linux-arm64/gox \
                      package/binaries/darwin-x64/gox package/binaries/darwin-arm64/gox \
                      package/binaries/windows-x64/gox.exe; do
            if ! printf '%s\n' "$CONTENT" | grep -qx "$want"; then
              missing="$missing ${want#package/}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::主包缺少：$missing ；实际内容：$(printf '%s' "$CONTENT" | tr '\n' ' ') ；若 binaries/ 整目录缺失，检查 .gitignore / npm/.npmignore 是否把手伸进了包内容"
            exit 1
          fi
          if printf '%s\n' "$CONTENT" | grep -q '^package/mobile/'; then
            echo "::error::主包 tarball 里出现了 mobile/ —— 移动端走平台子包（npm/packages/goxjs-mobile-*），不能塞回主包"
            exit 1
          fi
          echo "::notice::主包 $NAME@$VERSION 内容校验通过（无 mobile/），共 $(printf '%s\n' "$CONTENT" | wc -l) 个文件"

      - name: 子包打包校验（每个子包含产物且 sha256 与 manifest 一致）
        run: |
          set -euo pipefail
          DEST="$(pwd)/dist/npm-subpacks"
          mkdir -p "$DEST"; rm -f "$DEST"/*.tgz
          status=0
          for d in dist/npm-mobile-pkgs/*/; do
            [ -d "$d" ] || continue
            pj="$(cd "$d" && pwd)/package.json"
            pkgname=$(node -p "require(process.argv[1]).name" "$pj")
            ver=$(node -p "require(process.argv[1]).version" "$pj")
            base=$(printf '%s' "$pkgname" | sed 's#^@##; s#/#-#')
            tgz="$DEST/$base-$ver.tgz"
            ( cd "$d" && npm pack --pack-destination "$DEST" >/dev/null )
            [ -f "$tgz" ] || { echo "::error::$d npm pack 没产出 $tgz"; status=1; continue; }

            CONTENT=$(tar -tzf "$tgz" | sort)
            echo "── $base-$ver.tgz ──"; echo "$CONTENT"

            missing=""
            for f in $(node -p "require(process.argv[1]).files.join(' ')" "$pj"); do
              printf '%s\n' "$CONTENT" | grep -qx "package/$f" || missing="$missing $f"
            done
            if [ -n "$missing" ]; then echo "::error::子包 $base 缺少:$missing"; status=1; fi

            tmp=$(mktemp -d); tar -xzf "$tgz" -C "$tmp"
            mf="$tmp/package/manifest.json"
            if [ ! -f "$mf" ]; then
              echo "::error::子包 $base 包里没有 manifest.json"; status=1; rm -rf "$tmp"; continue
            fi
            for rel in $(node -p "require(process.argv[1]).artifacts.map(a=>a.path).join(' ')" "$mf"); do
              want=$(node -p "require(process.argv[1]).artifacts.find(a=>a.path===process.argv[2]).sha256" "$mf" "$rel")
              got=$(sha256sum "$tmp/package/$rel" | awk '{print $1}')
              if [ "$want" != "$got" ]; then
                echo "::error::子包 $base/$rel sha256 不符: manifest=$want 实际=$got"; status=1
              else
                echo "  [ok] $base/$rel sha256 $got"
              fi
            done
            rm -rf "$tmp"
          done
          [ "$status" = 0 ] || exit 1
          echo "::notice::全部平台子包内容与 sha256 核对通过"

      - name: 发布到 npm（OIDC：主包 + 各平台子包）
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # 这几行是排障口：不看它们，OIDC 失败和"trusted publisher 没配对"是同一个 404
          echo "npm：$(npm --version)"
          echo "NODE_AUTH_TOKEN 为空：$([ -z "${NODE_AUTH_TOKEN:-}" ] && echo yes || echo no)"
          echo "OIDC 端点可用：$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"

          # 主包（桌面五平台二进制）
          ( cd npm && npm publish --access public --provenance )

          # 平台子包：每个是独立 package.json + 产物，各自发。
          # ⚠️ 每个子包都要在 npmjs.com 上单独配 Trusted Publishing（同一组
          #    org/repo/workflow 字段），否则会以误导性的 404 收场。
          for d in dist/npm-mobile-pkgs/*/; do
            [ -d "$d" ] || continue
            pj="$(cd "$d" && pwd)/package.json"
            pkgname=$(node -p "require(process.argv[1]).name" "$pj")
            echo "==> 发布平台子包 $pkgname"
            ( cd "$d" && npm publish --access public --provenance )
          done

      - name: 打 tag + 建 Release（仅 push 到 main 且真发布时）
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，跳过"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi

      # 包目录里的 binaries/ 只是打包用的过客，别留在工作区（失败时也清）。
      # 移动端子包产物在 dist/npm-mobile-pkgs/（dist/ 已 gitignore），无需特殊清理。
      - name: 清理包目录里的二进制
        if: always()
        run: rm -rf npm/binaries

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS universal（fat 二进制）合并产物 → Release Assets（r3uF0e / RELEASE_NOTES
  # 已知问题 4）。
  #
  # 为什么单独一个 macos 作业：lipo 是 Apple 工具链的一部分，ubuntu 上没有；
  #   packager 里的 `gox build macos --arch universal` 也因此只能在 macOS 本地跑。
  #   与其自拼 Mach-O fat 格式（拼错了在 Linux 上根本无法验证，坏产物发出去用户
  #   双击才炸），不如花一次 macos runner 的启动钱换 Apple 官方工具 + 产物可当场
  #   执行冒烟 —— macos-14 是 arm64 机器，直接跑合并产物就同时验证了 fat 头、
  #   偏移对齐与 arm64 slice 里的 ad-hoc 签名。
  #
  # 上传什么：universal + 两个单 arch。universal 给"官网/Release 页直接下载"的
  #   用户；单 arch 是 gx/update 清单按架构分发的引用目标（清单 URL 可直接指向
  #   本 Release Assets），所以两者都保留、互不替代。其余平台二进制继续走 npm 包
  #   分发，不在这里重复上传。
  #
  # 依赖：needs publish —— Release/tag 由 publish 的最后一步建立，universal 的
  #   gh release upload 要求 tag 已存在；publish 跳过（判重命中）时本作业也跳过。
  # ─────────────────────────────────────────────────────────────────────────────
  universal:
    name: macOS universal 合并产物
    needs: [decide, publish]
    if: ${{ needs.decide.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: macos-latest
    # 15 → 30：公证是等 Apple 回执的，三个产物各提交一次，超时太紧会把正常的
    # 排队时间误判成失败（签名/公证没跑时仍是十几秒的原开销）。
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: 交叉编译 darwin 两个架构
        run: |
          set -euo pipefail
          mkdir -p dist/universal
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/universal/gox-darwin-amd64 ./cmd/gox
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o dist/universal/gox-darwin-arm64 ./cmd/gox
          ls -lh dist/universal/

      - name: lipo 合并 universal
        run: |
          set -euo pipefail
          lipo -create \
            -arch x86_64 dist/universal/gox-darwin-amd64 \
            -arch arm64 dist/universal/gox-darwin-arm64 \
            -output dist/universal/gox-darwin-universal
          lipo -info dist/universal/gox-darwin-universal

      - name: 冒烟（当场执行合并产物 —— arm64 runner 原生跑 arm64 slice）
        run: |
          set -euo pipefail
          OUT=$(dist/universal/gox-darwin-universal version)
          echo "$OUT"
          [ "$OUT" = "gox $VERSION" ] || {
            echo "::error::universal 产物版本输出「$OUT」与发版版本 gox $VERSION 不一致"
            exit 1
          }

      # ── 桌面签名（r8ErgP）：macOS codesign + 公证 ────────────────────────────
      # 签在这里而不另开作业：这三个 darwin 产物本来就在本作业里编出来（lipo 要
      #   Apple 工具链），签名/公证用到的也是同一台机器上的 Apple 工具链 ——
      #   与其把产物传出去再传回来，不如就地在上传 Release 之前盖完章。
      #
      # npm 包里的 darwin 二进制由 sign-macos 作业负责（要赶在 npm pack 之前），
      # 两者共用 scripts/sign-macos.sh 与同一组 secrets。
      - name: 探测 macOS 签名材料
        id: macos-cred
        env:
          HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          HAS_APPLE_API: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_CONTENT != '' }}
        run: bash scripts/check-signing-creds.sh macos

      - name: macOS 签名与公证（Release Assets 的 darwin 产物）
        if: steps.macos-cred.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          bash scripts/sign-macos.sh \
            dist/universal/gox-darwin-universal \
            dist/universal/gox-darwin-amd64 \
            dist/universal/gox-darwin-arm64

      - name: 上传 Release Assets（universal + 单 arch 两个）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          gh release upload "$TAG" \
            dist/universal/gox-darwin-universal \
            dist/universal/gox-darwin-amd64 \
            dist/universal/gox-darwin-arm64 \
            --clobber
          gh release view "$TAG" --json assets \
            -q '.assets[].name' | sed 's/^/已上传: /'

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS 移动端静态库 → 平台子包（M11 移动端发布面）
  #
  # 为什么单独一个 macos 作业：libgox.a 是 c-archive，链接要 Xcode 的 clang +
  #   iOS SDK；ubuntu 上的 publish 作业编不出来。所以这里先产出（整包子包，
  #   含 package.json + manifest.json）、以 artifact 交给 publish 一起发布 ——
  #   与 desktop 五平台（任意主机）、android（NDK，ubuntu 亦可）天然分成两组不同。
  #
  # 复用现成脚本：build-npm-mobile.sh --platform ios 内部调
  #   scripts/build-ios.sh --lib-only（同一份 CGO_CFLAGS/LDFLAGS，避免两处漂移），
  #   产出 goxjs-mobile-ios-{iphoneos,iphonesimulator}-arm64 两个子包目录。
  #
  # harmony 为什么不在 CI：鸿蒙侧要 DevEco SDK 的 OHOS clang + musl sysroot，
  #   GitHub 托管 runner 上装不了（需华为账号/许可，体积也大）。所以
  #   goxjs-mobile-harmony-* 只随本地 / 自建 runner 产出 —— 见
  #   scripts/build-npm-mobile.sh 头部说明与 app/MOBILE-DISTRIBUTION.md 的未完成边界。
  # ─────────────────────────────────────────────────────────────────────────────
  mobile-ios:
    name: iOS 平台子包（goxjs-mobile-ios-*）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: 交叉编译 iOS 平台子包（模拟器 + 真机）
        run: bash ./scripts/build-npm-mobile.sh --platform ios --out dist/npm-mobile-pkgs

      # 传整个子包目录树：publish 用 download-artifact 的 path 落成
      # dist/npm-mobile-pkgs/，于是 artifact 内部相对路径（goxjs-mobile-ios-*/…）
      # 正好接上 android 那边的同一目录，互不冲突。
      - name: 归档 iOS 平台子包
        uses: actions/upload-artifact@v4
        with:
          name: gox-mobile-ios-pkgs
          path: dist/npm-mobile-pkgs/**
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 桌面签名（r8ErgP）：macOS —— npm 包里的 darwin 二进制
  #
  # 为什么单独一个 macos 作业：codesign / notarytool / stapler 全是 Apple 工具链，
  #   只有 macOS runner 有；而 npm 包是在 ubuntu 的 publish 作业里打的，所以必须
  #   在 pack 之前把签好的二进制交回去 —— 于是本作业先编（与 build-npm.sh 同一组
  #   flag：darwin 是纯 Go 交叉编译，在哪编都一样）再签，产物以 artifact 回传。
  #   代价是 darwin 两个架构多编一次（几十秒），换来的是 publish 那边不用重排顺序。
  #
  # 缺凭证 → 整体跳过（一步都不跑，也不传 artifact），publish 用它自己编的未签名
  #   产物，发布不阻塞。凭证配齐但签名/公证失败 → 判红并连带挡住 publish：配了凭证
  #   就说明要签名产物，静默发出未签名包比发不出更糟。Apple 服务长时间不可用时
  #   的逃生口是临时把 MACOS_CERT_P12_BASE64 置空，退回跳过路径。
  #
  # 公证凭证与 TestFlight 同一套（App Store Connect API 密钥）：APPLE_API_KEY /
  #   APPLE_API_ISSUER / APPLE_API_KEY_CONTENT；签名证书要 Developer ID Application
  #   的 p12（MACOS_CERT_P12_BASE64 + MACOS_CERT_PASSWORD）。
  # ─────────────────────────────────────────────────────────────────────────────
  sign-macos:
    name: macOS 签名与公证（npm darwin 二进制）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      # publish 靠这个判断「有没有签名产物可拿」。它必须来自探测步骤而不是
      # `result`：缺凭证时本作业仍然是 success（只是内部步骤全跳过、不传 artifact）。
      signed: ${{ steps.macos-cred.outputs.enabled }}
    steps:
      # 探测放在最前：缺凭证时连 checkout / setup-go 都不必跑，省一次 runner 开销；
      # 后面每一步都用同一个闸门，拿到的是同一个结论（不会各步各判一次而漂移）。
      - name: 探测 macOS 签名材料
        id: macos-cred
        env:
          HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          HAS_APPLE_API: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_CONTENT != '' }}
        run: bash scripts/check-signing-creds.sh macos

      - uses: actions/checkout@v7
        if: steps.macos-cred.outputs.enabled == 'true'

      - uses: actions/setup-go@v7
        if: steps.macos-cred.outputs.enabled == 'true'
        with:
          go-version-file: go.mod
          check-latest: true

      - name: 交叉编译 darwin 两个架构
        if: steps.macos-cred.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/darwin-signed/darwin-x64 dist/darwin-signed/darwin-arm64
          # flag 与 scripts/build-npm.sh 逐字一致：签名产物必须与未签名产物同源，
          # 否则「签过的包」和「没签的包」行为不同就无从排查。
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/darwin-signed/darwin-x64/gox ./cmd/gox
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o dist/darwin-signed/darwin-arm64/gox ./cmd/gox
          ls -lh dist/darwin-signed/*/gox

      - name: codesign → notarytool → stapler
        if: steps.macos-cred.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          bash scripts/sign-macos.sh \
            dist/darwin-signed/darwin-x64/gox \
            dist/darwin-signed/darwin-arm64/gox

      # 目录名 darwin-x64 / darwin-arm64 与 npm/binaries/ 下的名字逐字对应：
      # publish 那边按同名替换，不用再维护一张映射表。
      - name: 归档签名后的 darwin 二进制
        if: steps.macos-cred.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gox-darwin-signed
          path: dist/darwin-signed/**
          if-no-files-found: error
