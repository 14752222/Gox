# ─────────────────────────────────────────────────────────────────────────────
# Test262 合规率流水线（S1/T01）
#
# 为什么需要这个文件：`gox test262`（cmd/gox/cmd_test262.go）能把 ECMAScript
#   合规现状量化出来，docs/test262-t04-report.md 记录了两轮提分工程（15.32% →
#   31.56%），但那个数字是手跑的 —— 引擎后来又变了，README 上却看不到实时值。
#   本工作流把四件事钉死在 CI 上：
#     1. 定期/引擎变更时跑全量 language 与 built-ins 两个套件（language 本地
#        20s、built-ins 约 60s，CI 上分钟级）。built-ins 是 rnm4C5 起的第二个
#        观测面：language 做到 78% 后边际收益在掉，built-ins 实测 35.7%
#        （约 2.4 万例）是下一个明确洼地；
#     2. 把合规率写成 shields.io endpoint 徽章格式提交回
#        docs/test262-compliance.json（language）与
#        docs/test262-compliance-builtins.json（built-ins）—— README 的徽章
#        直接读这两份 JSON，每次跑完自动更新，无需人手；
#     3. **合规率下限闸门**（scripts/check-compliance.py）：跑完先跟各自的基线
#        （docs/test262-baseline.json / docs/test262-baseline-builtins.json）
#        比，掉了就红。以前只有徽章上的数字在变，合规率从 78% 掉到 74% CI 依然
#        是绿的，只有人去读数字才会发现 —— 现在不会了。闸门过了才刷新基线，所以
#        基线恒等于「上次通过闸门时的合规率」。**两个套件必须各用一份基线**：
#        分母不同（2.37 万 vs 2.38 万但构成完全不同），共用一份会让一边的波动
#        触发另一边的红；
#     4. 完整逐用例结果上传为 artifact，供回归排查（哪个子集掉了、掉在哪条）。
#        built-ins 的逐用例结果还能直接喂 scripts/test262-cluster.py 做失败面
#        聚类（"目录族 × 失败形态"Top 簇），排期按簇开单而不是按条修。
#
# 闸门判据（完整说明见 scripts/check-compliance.py 文件头）：
#   用例集没变（total 变化 ≤1%）⇒ 直接比率，跌过 0.5pp 即红；
#   用例集变了（>1%，通常是 test262 上游加用例）⇒ 率不可比，降级为提示，改看
#   passed 绝对数 —— "过的用例变少了"在任何分母下都是硬信号。
#
# 卡住了解锁：上游一次加几百个用例就可能让通过数掉过 1%。这时不是回归，手动
#   dispatch 勾上 refresh_baseline 跳过闸门重设基线。
#
# 触发策略：
#   - 每周一 03:00 UTC 定时 —— 官方 test262 是滚动仓库，浅克隆总能拿到最新用例，
#     上游加用例导致合规率波动也能被发现；
#   - 推送触碰引擎核心（parser/compiler/vm/object/stdlib/runner 本身）时 ——
#     "每修一个引擎缺陷，合规率涨了多少"要能立刻在 README 上看到；
#   - 本 workflow 自己提交的四份 docs/test262-*.json（两个徽章 + 两个基线）
#     都不在 paths 里，天然不会自触发死循环。
#
# 与 ci.yml 的关系：ci.yml 是推送闸门（注册表/构建/测试，windows-latest）；
#   本工作流是趋势观测 + 合规率下限，慢一点、提交回 main 都不阻塞别人。互不依赖。
# 失败时怎么查：先看"合规率汇总"步骤的 GITHUB_STEP_SUMMARY（有按目录分组），
#   再看"合规率下限闸门"步骤（会打印基线与现值三行对照 + ::error:: 注解），
#   最后下 artifact 里的逐用例 JSONL 对比上一次 run 找回归用例。
# ─────────────────────────────────────────────────────────────────────────────
name: test262

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: '跳过合规率下限闸门，直接把本次结果刷新为基线（test262 上游加用例导致闸门卡住时用）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'cmd/gox/cmd_test262.go'
      - 'parser/**'
      - 'compiler/**'
      - 'vm/**'
      - 'object/**'
      - 'stdlib/**'
      - 'scripts/check-compliance.py'
      - '.github/workflows/test262.yml'

permissions:
  contents: write # 把更新后的徽章数据（docs/test262-compliance*.json）与基线提交回 main

concurrency:
  group: test262-${{ github.ref }}
  cancel-in-progress: false # 提交回 main 的作业被取消会留半截状态，排队更稳

jobs:
  compliance:
    # 两个套件各跑一遍、各写一份徽章、各守一条下限闸门。用 matrix 而不是复制
    # 第二个 job：跑批→徽章→闸门→提交这条链有 8 步，复制一遍必然在某一次改动
    # 里漏同步（一边加闸门另一边没加）。两套件分母不同，必须各用自己的基线
    # 文件 —— 共用一份会让一边的波动触发另一边的红。
    name: ${{ matrix.label }} 套件合规率
    runs-on: ubuntu-latest # runner 是一次性 CLI，纯语言语义无 GUI 依赖，Linux 最快
    timeout-minutes: 30
    strategy:
      fail-fast: false # built-ins 红不许把 language 的成果一起取消
      matrix:
        include:
          - suite: language
            label: language
            badge: docs/test262-compliance.json
            baseline: docs/test262-baseline.json
          - suite: built-ins
            label: built-ins
            badge: docs/test262-compliance-builtins.json
            baseline: docs/test262-baseline-builtins.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 官方一致性套件。浅克隆即可 —— runner 只读 test/ 与 harness/，不关心历史。
      - name: 克隆 test262（浅）
        run: git clone --depth 1 https://github.com/tc39/test262.git "$RUNNER_TEMP/test262"

      - name: 构建 gox
        run: go build -o "$RUNNER_TEMP/gox" ./cmd/gox

      # 口径：language 是 T04 报告的口径；built-ins 是 rnm4C5 起新增的第二个
      # 观测面（约 2.4 万例，实测 35.7% —— 下一个明确洼地）。两者分母都是
      # "实际收集到的用例"（runner 侧跳过的计入分母不计通过）。
      # -jobs 拉满 runner 核数；runner 内部按目录分片并行。
      - name: 跑 ${{ matrix.label }} 套件
        run: |
          "$RUNNER_TEMP/gox" test262 \
            -root "$RUNNER_TEMP/test262" \
            -suite "${{ matrix.suite }}" \
            -jobs "$(nproc)" \
            -json "test262-results-${{ matrix.suite }}.json"

      - name: 合规率汇总
        env:
          BADGE: ${{ matrix.badge }}
          LABEL: ${{ matrix.label }}
          RESULTS: test262-results-${{ matrix.suite }}.json
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ["RESULTS"]))
          rate = d["rate_pct"]
          color = ("brightgreen" if rate >= 90 else "yellowgreen" if rate >= 70
                   else "yellow" if rate >= 50 else "orange" if rate >= 30 else "red")
          badge = {"schemaVersion": 1, "label": "test262 " + os.environ["LABEL"],
                   "message": f"{rate:.1f}%", "color": color}
          os.makedirs("docs", exist_ok=True)
          with open(os.environ["BADGE"], "w") as f:
              json.dump(badge, f, indent=2)
              f.write("\n")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary:
              raise SystemExit
          groups = sorted(d["by_group"].items(), key=lambda kv: kv[1]["rate_pct"])
          lines = [
              f"# Test262 {os.environ['LABEL']} 合规率：{rate:.2f}%",
              "",
              f"通过 {d['passed']} / {d['total']}（跳过 {d['skipped']}），"
              f"耗时 {d['seconds']:.0f}s",
              "",
              "## 最薄弱的 15 个子集（提分优先级参考）",
              "",
              "| 子集 | 合规率 | 通过/总数 |",
              "|------|--------|-----------|",
          ]
          for name, g in groups[:15]:
              lines.append(
                  f"| {name} | {g['rate_pct']:.2f}% | {g['pass']}/{g['total']} |")
          open(summary, "w").write("\n".join(lines) + "\n")
          PY

      # 自检必须放在闸门之前：万一判据失效（永远输出 ok），先知道，而不是
      # 白跑一轮之后得到一条假绿 —— 一个从没失败过的闸门等于黑盒。
      - name: 闸门自检（负向样本必须真的红）
        run: |
          set -euo pipefail
          if ! python3 scripts/check-compliance.py --self-test; then
            echo "::error::test262 合规率闸门自测未通过 —— 判据或负向样本失效，它可能已经不再拦任何东西"
            exit 1
          fi

      # 红在这里 = 合规率掉了。失败原因（基线/现值/折算掉多少用例）由脚本自己
      # 写成 ::error::，这里不补一句笼统的话 —— 那会让注解里出现两条信息量
      # 不对等的红。
      - name: 合规率下限闸门
        if: ${{ !inputs.refresh_baseline }}
        run: |
          set -euo pipefail
          python3 scripts/check-compliance.py \
            --current "test262-results-${{ matrix.suite }}.json" \
            --baseline "${{ matrix.baseline }}" \
            --github

      - name: 上传逐用例结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-results-${{ matrix.suite }}
          path: test262-results-${{ matrix.suite }}.json
          retention-days: 90

      # 只有闸门过了才刷新基线 —— 所以基线恒等于「上一次通过闸门时的合规率」，
      # 一次回归不会把基线一起拉低而把后续所有轮次都洗白。
      - name: 刷新合规率基线
        if: ${{ success() }}
        run: |
          set -euo pipefail
          python3 scripts/check-compliance.py \
            --current "test262-results-${{ matrix.suite }}.json" \
            --baseline "${{ matrix.baseline }}" \
            --update-baseline

      - name: 提交徽章数据与基线回 main
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test262-compliance.json docs/test262-baseline.json \
                  docs/test262-compliance-builtins.json docs/test262-baseline-builtins.json
          if git diff --cached --quiet; then
            echo "合规率无变化，跳过提交"
          else
            git commit -m "chore(test262): 更新合规率徽章数据与基线（$(date -u +%F)）"
            git push
          fi
