# ─────────────────────────────────────────────────────────────────────────────
# good-first-issue 播种器：把 .github/ISSUE_DRAFTS/ 下的草案一次性建成 issue。
#
# 为什么需要它：issue 模板已上线（T21），但「首批 3 个带 good first issue 标签的
# 任务」（DoD 要求 ≥3 个）没法在本地建 —— 本机的 GitHub 连接器 token 只有读权限
# （写 issue 报 403 Resource not accessible by integration），SSH 凭据只能 push。
# 而 GITHUB_TOKEN 在 Actions 里天然带 issues:write（仓库自己的 token 对自己仓库）。
#
# 幂等：按标题精确匹配已有 issue，存在即跳过 —— 重跑、误触发都不会重复建。
# 一次性：建完这批就把本文件删掉（或者留着也不炸，它只在 push 到 main 时跑一次
# 判重循环，全部命中时几秒退出）。
#
# 草案文件约定：.github/ISSUE_DRAFTS/*.md，文件名即 issue 标题，正文里首行若以
# `labels: ` 开头则解析为标签列表（JSON 数组格式），其余为 issue 正文。
# ─────────────────────────────────────────────────────────────────────────────
name: seed-issues

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: seed-issues
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 从草案创建缺失的 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 全量 open issue 标题做判重基线（仓库 issue 少，不必走搜索 ——
          # 标题里的括号/空格会干扰 search 的查询语法）
          mapfile -t existing < <(gh issue list -R "$GITHUB_REPOSITORY" --state open --json title -q '.[].title')
          for f in .github/ISSUE_DRAFTS/*.md; do
            [ -f "$f" ] || { echo "没有草案，跳过"; exit 0; }
            title=$(basename "$f" .md)
            skip=0
            for t in "${existing[@]:-}"; do [ "$t" = "$title" ] && skip=1 && break; done
            if [ "$skip" = 1 ]; then echo "[skip] 已存在：$title"; continue; fi
            # 首行必须是 labels: [...] 声明（用 [[ == ]] 判前缀，避开 pipefail 下
            # head|grep -q 的 SIGPIPE 假失败）
            first=$(head -1 "$f")
            if [[ "$first" != labels:* ]]; then
              echo "::error::file=$f 首行不是 labels: 声明，实际是：$first"
              exit 1
            fi
            # 标签经 bash 数组传参 —— 带空格的标签名（good first issue）不能走
            # 字符串拼接 + 无引号展开，会被词拆成多个参数（首版就死在这）
            mapfile -t labs < <(sed 's/^labels: //' <<<"$first" | jq -r '.[]')
            args=()
            for lab in "${labs[@]}"; do args+=(--label "$lab"); done
            body=$(tail -n +2 "$f")
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" "${args[@]}" --body "$body"
            echo "[created] $title"
          done
