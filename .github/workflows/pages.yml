# ─────────────────────────────────────────────────────────────────────────────
# Gox 官网发布：把 website/（VitePress）构建后部署到 GitHub Pages
#   线上地址 https://14752222.github.io/Gox/
#
# 历史：2026-09-21 website/ 收回版本库并上这条流水线（当时是 4 页手写 HTML）；
#   2026-09-25 website 迁移到 VitePress（29 页，独立仓库 gox-website），
#   流水线随之改为「版本号一致 → pnpm install → vitepress build → 部署 dist」。
#   旧的 scripts/check-site.py 只认顶层 *.html，对 VitePress 源无效，已不再被
#   本流水线调用；它的职责（标签配对/版本一致/链接/锚点）中：
#   - 死链检查由 vitepress build 承担（config.mts 里 ignoreDeadLinks: false，
#     构建期发现断链直接失败）；
#   - 版本号一致由下方「版本号一致」步骤承担（npm/package.json ↔
#     config.mts 的 softwareVersion ↔ index.md 的「当前版本 **vX.Y.Z**」）。
#
# website/ · npm/ 是独立仓库的子模块：官网改动提交在 gox-website，主仓库这边
#   只看到 gitlink 指针变化，路径是 `website`（没有斜杠）—— `website/**` 匹配
#   不到，所以 paths 里必须单独列一条裸 `website`。只推 gox-website 不触发本
#   工作流，必须回主仓库提交子模块指针。
#
# 一次性前置（仓库设置，代码改不了）：Settings → Pages → Build and deployment →
#   Source 必须选 **GitHub Actions**。
#
# 与 release.yml 的关系：完全独立，互不触发。
# ─────────────────────────────────────────────────────────────────────────────
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website'
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 官网发布是串行资源：连续两次推送只跑最后一次，避免旧构建覆盖新构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 检查 + 构建
    runs-on: ubuntu-latest
    steps:
      # website/ · npm/ 是子模块，不显式拉取就是空目录
      # （版本号一致步骤要读 npm/package.json）。
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: 版本号一致（npm ↔ config.mts ↔ index.md）
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./npm/package.json').version")
          SITE=$(grep -oP "softwareVersion:\s*'\K[0-9][0-9.]*" website/.vitepress/config.mts || true)
          INDEX=$(grep -oP '当前版本 \*\*v\K[0-9][0-9.]*' website/index.md || true)
          echo "npm/package.json: $PKG"
          echo "config.mts softwareVersion: ${SITE:-缺失}"
          echo "index.md 当前版本: ${INDEX:-缺失}"
          fail=0
          if [ -z "$SITE" ]; then
            echo "::error::website/.vitepress/config.mts 里找不到 softwareVersion"; fail=1
          fi
          if [ -z "$INDEX" ]; then
            echo "::error::website/index.md 里找不到「当前版本 **vX.Y.Z**」"; fail=1
          fi
          if [ "$fail" != 0 ]; then exit 1; fi
          if [ "$PKG" != "$SITE" ] || [ "$PKG" != "$INDEX" ]; then
            echo "::error::版本号不一致：npm=$PKG config.mts=$SITE index.md=$INDEX —— 发版时三处要一起改"
            exit 1
          fi
          echo "三处版本号一致：$PKG"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 安装 pnpm
        run: |
          npm install -g pnpm@9
          pnpm --version

      - name: 安装依赖
        working-directory: website
        run: pnpm install --frozen-lockfile

      # ignoreDeadLinks: false —— 站内断链在这里直接构建失败（CI 兜底）
      - name: 构建（含死链检查）
        working-directory: website
        run: pnpm build

      - name: 回显构建产物
        run: |
          test -f website/.vitepress/dist/index.html || {
            echo "::error::构建产物里没有 index.html"; exit 1
          }
          ls website/.vitepress/dist | head -20

      - name: 打包站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 回显线上地址
        run: |
          echo "已发布：${{ steps.deployment.outputs.page_url }}"
