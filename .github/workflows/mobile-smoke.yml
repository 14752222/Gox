# ─────────────────────────────────────────────────────────────────────────────
# 移动端构建冒烟：Android 打包（libgox.so + gradle assembleDebug）+ iOS 模拟器编译
#               + npm 包内容核对（mobile/ 是否真的进 @goxjs/goxjs 发布面，M11）
#
# 为什么需要这个文件（T22）：桌面三平台已有 ci.yml 闸门，但移动端构建完全依赖
# 本地手工（Windows/macOS 各一套工具链），跨平台编译回归（NDK/Xcode 升级、
# cgo 标志变化、壳工程配置漂移）只能等真机验收时才发现 —— 发现即返工。
#
# 设计取舍（三条，都有理由）：
#   1. Android/iOS 拆成两个独立 job —— 验收标准要求「1 分钟内定位哪一端失败」，
#      共用一个 job 的话两端日志混在一起，Annotations 也只报一次。
#   2. Android 走仓库壳工程 app/android（settings/AGP 8.6.1/Kotlin 1.9.24 是
#      2026-09 实测过的组合），而不是 gox create 脚手架 —— 脚手架模板的 android/
#      目前没有 settings.gradle.kts 且 build.gradle.kts 未声明 AGP 版本，
#      裸 gradle 起不来；壳工程是「打包冒烟」要保真的那条链路。
#   3. iOS 只编模拟器目标（--simulator 缺省路径，免签名）—— CI runner 没有
#      签名证书，真机签名链路留给本地与 TestFlight（见 T24 回归矩阵）。
#
# iOS 冒烟为什么不用脚手架入口 src/main.js：脚手架入口 import 了 ./app.js，
# 而 iOS 壳是 EvalVM 单文件执行（无 module base，见 build-ios.sh 尾段校验），
# 相对 import 会直接报错退出。冒烟用一个自包含 entry，走 --entry 注入。
#
# 与其它工作流的关系：与 ci.yml 互不触发、互不阻塞；只读，无 secret。
# 产物：每次主分支提交可下载 app-debug.apk 与 Gox-smoke.app（zip）。
# ─────────────────────────────────────────────────────────────────────────────
name: mobile-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android 打包冒烟（libgox.so + APK）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 子模块已全部摘除（npm/website 等是独立仓库，本作业不读它们）。
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # AGP 8.6 要求 JDK 17（app/android/build.gradle.kts 头部注释里的实测组合）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 固定 Gradle 8.9：与 AGP 8.6.1 / compileSdk 35 的组合在本地真机验收时验证过
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 交叉编译 libgox.so (arm64-v8a)
        run: |
          set -euo pipefail
          # runner 预装了 NDK 但 ANDROID_NDK_HOME 不一定指向具体版本目录，
          # 选 $ANDROID_HOME/ndk/ 下最新的一个（目录名即版本号）。
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::找不到 Android NDK（ANDROID_HOME=$ANDROID_HOME）—— runner 镜像变了？"
            exit 1
          fi
          echo "==> NDK: $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          bash scripts/build-android.sh
          test -f dist/android/arm64-v8a/libgox.so

      # build-android.sh 只产 libgox.so，装进 APK 由壳工程 gradle 负责（见 app/android/README.md）
      - name: 拷贝 libgox.so 进壳工程 jniLibs
        run: |
          set -euo pipefail
          mkdir -p app/android/app/src/main/jniLibs/arm64-v8a
          cp dist/android/arm64-v8a/libgox.so app/android/app/src/main/jniLibs/arm64-v8a/
          ls -la app/android/app/src/main/jniLibs/arm64-v8a/

      - name: gradle assembleDebug 出 APK
        working-directory: app/android
        run: gradle assembleDebug --no-daemon

      - name: 归档 APK
        uses: actions/upload-artifact@v4
        with:
          name: gox-android-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS 模拟器编译冒烟
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # 壳工程 Gox.xcodeproj 是 XcodeGen 生成物（app/ios/.gitignore 刻意忽略
      # *.xcodeproj，生成源是 project.yml）—— 本机有、CI checkout 没有，
      # 不生成的话 build-ios.sh 会报"找不到壳工程"。sources 不依赖 libs/ 产物，
      # checkout 后即可生成（README 流程：cd app/ios && xcodegen generate）。
      - name: XcodeGen 生成壳工程
        run: |
          set -euo pipefail
          brew install xcodegen
          cd app/ios && xcodegen generate

      # 冒烟走完整用户链路：gox create 铺工程 → gox build ios --simulator
      # （sync 权限注入 + 图标生成 + libgox.a + xcodebuild 壳工程全跑一遍）
      # 注意两个 2026-09-27 本机实测踩过的点：
      #   1. --entry 相对的是**工程目录**（smoke/），不是工作目录 —— entry 必须
      #      写进 smoke/ 里，否则 gox build 直接报"入口脚本不存在"；
      #   2. 产物 .app 是壳工程 Gox.app 改名而来，bundle 内可执行文件仍叫
      #      Gox（CFBundleExecutable），断言可执行性要用 plutil 读真名。
      - name: gox create 冒烟工程 + gox build ios --simulator
        env:
          GOX_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/gox" ./cmd/gox || { echo "::error::go build gox 失败"; exit 1; }
          mkdir -p "$RUNNER_TEMP/smoke-work"
          cd "$RUNNER_TEMP/smoke-work"
          "$RUNNER_TEMP/gox" create smoke --name gox-smoke || { echo "::error::gox create 失败"; exit 1; }

          cat > smoke/smoke-entry.js <<'EOF'
          // CI 冒烟入口：自包含单文件（只 import 内置模块）。
          // 组件用 text（内置清单里没有 label）—— 用法对齐 app/android 验收脚本。
          import { h, render } from "gx/gfx";
          render(
            <window title="gox-smoke">
              <column padding={20}>
                <text font={16}>gox mobile smoke</text>
                <button>ok</button>
              </column>
            </window>
          );
          EOF

          # 失败时把末尾输出打成 ::error:: 注解 —— 摘要页可直接看到原因，
          # 不依赖有日志下载权限（runner Xcode 版本与本机不同，失败点要拿实证）
          if ! "$RUNNER_TEMP/gox" build ios smoke --simulator --entry smoke-entry.js 2>&1 | tee ios-build.log; then
            echo "::error::gox build ios 失败，末尾 15 行输出如下（完整日志在步骤日志里）"
            tail -15 ios-build.log | while IFS= read -r l; do echo "::error::${l:0:500}"; done
            exit 1
          fi
          APP=$(ls -d smoke/dist/*.app)
          echo "==> 产物: $APP"
          EXE=$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")
          test -x "$APP/$EXE" || { echo "::error::bundle 内找不到可执行文件 $EXE"; exit 1; }
          # 入口脚本必须真的进了 bundle（壳从 bundle 根读 app.js）
          cmp -s "$APP/app.js" smoke/smoke-entry.js || { echo "::error::bundle app.js 与冒烟入口不一致"; exit 1; }
          zip -qry gox-smoke-ios-sim.zip "$APP"

      - name: 归档 .app（zip）
        uses: actions/upload-artifact@v4
        with:
          name: gox-ios-simulator-app
          path: ${{ runner.temp }}/smoke-work/gox-smoke-ios-sim.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # npm 包内容核对（M11）：移动端产物走「平台子包」，主包必须**不含** mobile/。
  #
  # 为什么单独一条「查包内容」的作业：上一轮发空壳包（0.2.0 丢了全部二进制）的
  # 教训是——CI 全绿 ≠ 包内容对。忽略规则、files 白名单、staging 目录三者任一
  # 出岔子，编译与打包都照样成功，只有把 tarball 解开逐条比对才看得见。
  # 所以这里跟 release.yml 的「打包校验」用同一份判据，但跑在每次 main 推送，
  # 不必等到发版才发现。
  #
  # M11 的两条断言（缺一不可）：
  #   1. 主包 @goxjs/goxjs 的 tarball **不含 mobile/**，且没有大文件回归
  #      —— 移动端 .so/.a 一旦混进主包，就是"又给桌面用户塞 50MB"的回归；
  #   2. 每个平台子包 @goxjs/goxjs-mobile-* 的 tarball 含自己的产物，且解包后
  #      逐产物 sha256 与 manifest.json 一致 —— 子包才是移动端的发布面。
  #
  # 只验 android（本 runner 能编）：ios 要 macos 专属作业（见 release.yml 的
  # mobile-ios），harmony 要 DevEco SDK（托管 runner 没有）—— 各自在别处覆盖/说明。
  # ─────────────────────────────────────────────────────────────────────────────
  npm-package:
    name: npm 包内容核对（主包无 mobile/ + 子包含产物）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # npm/ 是独立仓库（gox-npm）：断言子包定义同步与 tarball 检查要读
      # npm/package.json 与 npm/packages/*，显式 checkout 到 npm/。
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 14752222/gox-npm
          path: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 断言子包定义已同步（packaging/npm-mobile/ → npm/packages/）
        run: |
          set -euo pipefail
          # 单一真源在主仓 packaging/npm-mobile/<dirname>/metadata.json；
          # npm/packages/ 下的 package.json 是生成物。手改了生成物忘了刷新定义会在这里红。
          python3 scripts/gen-npm-mobile-pkgs.py --check

      - name: 交叉编译 android 平台子包
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::找不到 Android NDK（ANDROID_HOME=$ANDROID_HOME）"
            exit 1
          fi
          bash scripts/build-npm-mobile.sh --platform android --abi arm64-v8a

      # tarball 名由包名 + 版本推导，不去解析 npm 的 stdout（各版本输出格式不同）。
      - name: 主包 pack —— 断言不含 mobile/ 且无大文件回归
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./npm/package.json').name.replace(/^@/, '').replace('/', '-')")
          VERSION=$(node -p "require('./npm/package.json').version")
          DEST="$(pwd)/dist/npm-main-pack"
          mkdir -p "$DEST"; rm -f "$DEST"/*.tgz
          ( cd npm && npm pack --pack-destination "$DEST" >/dev/null )
          TARBALL="$DEST/$NAME-$VERSION.tgz"
          [ -f "$TARBALL" ] || { echo "::error::npm pack 没有产出 $TARBALL"; exit 1; }

          CONTENT=$(tar -tzf "$TARBALL" | sort)
          echo "主包内容："; echo "$CONTENT"

          for want in package/package.json package/bin/gox.js; do
            printf '%s\n' "$CONTENT" | grep -qx "$want" || { echo "::error::主包缺少 $want"; exit 1; }
          done
          if printf '%s\n' "$CONTENT" | grep -q '^package/mobile/'; then
            echo "::error::主包 tarball 里出现了 mobile/ —— 移动端应走平台子包（npm/packages/goxjs-mobile-*），不能塞回主包"
            exit 1
          fi
          # 体积回归兜底：本作业不编桌面 binaries/，主包只该有 bin/gox.js + package.json。
          # 出现任何 >5MB 的条目都说明有二进制（移动端/桌面）混进来了。
          BIG=$(tar -tvzf "$TARBALL" | awk '$3 > 5000000 {print $3" "$NF}')
          if [ -n "$BIG" ]; then
            echo "::error::主包里出现大文件（>5MB），疑似二进制回归：$BIG"
            exit 1
          fi
          echo "::notice::主包不含 mobile/，tarball $(wc -c < "$TARBALL") 字节，共 $(printf '%s\n' "$CONTENT" | wc -l) 个条目"

      - name: 逐个子包 pack —— 断言含产物且 sha256 与 manifest 一致
        run: |
          set -euo pipefail
          DEST="$(pwd)/dist/npm-subpacks"
          mkdir -p "$DEST"; rm -f "$DEST"/*.tgz
          status=0
          for d in dist/npm-mobile-pkgs/*/; do
            [ -d "$d" ] || continue
            pj="$(cd "$d" && pwd)/package.json"
            pkgname=$(node -p "require(process.argv[1]).name" "$pj")
            ver=$(node -p "require(process.argv[1]).version" "$pj")
            base=$(printf '%s' "$pkgname" | sed 's#^@##; s#/#-#')
            tgz="$DEST/$base-$ver.tgz"
            ( cd "$d" && npm pack --pack-destination "$DEST" >/dev/null )
            [ -f "$tgz" ] || { echo "::error::$d npm pack 没产出 $tgz"; status=1; continue; }

            CONTENT=$(tar -tzf "$tgz" | sort)
            echo "── $base-$ver.tgz ──"; echo "$CONTENT"

            # 断言 1：files 白名单里的每个文件都在包里
            missing=""
            for f in $(node -p "require(process.argv[1]).files.join(' ')" "$pj"); do
              printf '%s\n' "$CONTENT" | grep -qx "package/$f" || missing="$missing $f"
            done
            if [ -n "$missing" ]; then echo "::error::$base 缺少:$missing"; status=1; fi

            # 断言 2：解包后逐产物 sha256 与 manifest.json 一致
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp"
            mf="$tmp/package/manifest.json"
            [ -f "$mf" ] || { echo "::error::$base 包里没有 manifest.json"; status=1; rm -rf "$tmp"; continue; }
            for rel in $(node -p "require(process.argv[1]).artifacts.map(a=>a.path).join(' ')" "$mf"); do
              want=$(node -p "require(process.argv[1]).artifacts.find(a=>a.path===process.argv[2]).sha256" "$mf" "$rel")
              got=$(sha256sum "$tmp/package/$rel" | awk '{print $1}')
              if [ "$want" != "$got" ]; then
                echo "::error::$base/$rel sha256 不符: manifest=$want 实际=$got"; status=1
              else
                echo "  [ok] $base/$rel sha256 $got"
              fi
            done
            rm -rf "$tmp"
          done
          [ "$status" = 0 ] || exit 1
          echo "::notice::全部平台子包内容与 sha256 核对通过"

  # ─────────────────────────────────────────────────────────────────────────
  # Android 折叠态切换回归（看板单 rSm7zW / S4 / N4）
  #
  # 边界先写死：**真切换折叠态需要能模拟铰链的 AVD**（pixel_fold 类 profile，
  # API 34+）。普通手机模拟器上 `cmd device_state print-states` 只报一个态，
  # 切了也没反应 —— 所以 job 第一步就先 print-states 断言折叠态存在，
  # 拿不到就直接红，而不是静默当「已验证折叠」。
  # 这是「模拟器能跑」到「每次提交都不退步」的关键一跳：每次 push 都在折叠
  # 屏上把 CLOSED → HALF_FOLDED → OPENED 切一遍，截屏存档（artifacts），
  # 红即阻断（分支保护标 required 即可）。
  # ─────────────────────────────────────────────────────────────────────────
  android-fold-emulator:
    name: Android 折叠态切换回归（pixel_fold 模拟器）
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # android-emulator-runner 的脚本跑在 JDK 上，与 android job 同版本
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 下载冒烟 APK（android job 的产物）
        uses: actions/download-artifact@v4
        with:
          name: gox-android-debug-apk
          path: /tmp/apk

      # KVM 是 emulator-runner 的硬性前置：没有硬件加速模拟器起不来
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 设备表随 runner 的 cmdline-tools 版本漂移（pixel_fold 在部分 SDK 里不存在，
      # 0414b7e6 那次就挂在 "No device found matching --device pixel_fold"）——
      # 不再硬编码 profile，探测到什么 fold 设备用什么；一个都没有就显式 skip。
      - name: 探测可用的折叠屏 AVD profile
        id: fold
        run: |
          set -euo pipefail
          # avdmanager 不在默认 PATH（emulator-runner 内部自己拼路径），这里补上
          export PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin:$PATH"
          if ! command -v avdmanager >/dev/null 2>&1; then
            echo "available=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::avdmanager 不在 PATH（cmdline-tools 布局变了？）—— 本 job 退化为 skip（折叠态回归靠本地 scripts/mobile-device-accept.sh --rounds 20 与 gfx 生命周期测试兜底）"
            exit 0
          fi
          IDS=$(avdmanager list device | sed -n 's/^id: [0-9]* or "\(.*\)"$/\1/p')
          FOLD=$(echo "$IDS" | grep -i fold | head -1 || true)
          if [ -z "$FOLD" ]; then
            echo "available=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::avdmanager 设备表里没有任何 fold profile —— 本 job 退化为 skip（折叠态回归靠本地 scripts/mobile-device-accept.sh --rounds 20 与 gfx 生命周期测试兜底）"
          else
            echo "available=run" >> "$GITHUB_OUTPUT"
            echo "profile=$FOLD" >> "$GITHUB_OUTPUT"
            echo "==> 使用 fold profile: $FOLD"
          fi

      - name: 折叠态矩阵（CLOSED/HALF_FOLDED/OPENED 切换 + 截图）
        if: steps.fold.outputs.available == 'run'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ steps.fold.outputs.profile }}
          disable-animations: true
          script: |
            # ⚠️ emulator-runner 用 /bin/sh(dash) 执行本脚本 —— 不能写 pipefail
            set -eu

            # 1) 折叠态必须在场 —— 拿不到就是 profile 不对（见 job 头注释）
            adb shell cmd device_state print-states | tee /tmp/states.txt
            # 态名随 API 级别漂移（34 报 HALF_OPENED，更早是 HALF_FOLDED）——
            # 不硬编码，下面解析实际报出的名字逐一切换
            STATES=$(grep -ohE 'CLOSED|HALF_FOLDED|HALF_OPENED|OPENED' /tmp/states.txt | sort -u | tr '\n' ' ')
            echo "==> 可用折叠态: $STATES"
            # ⚠️ dash 下反斜杠续行不可靠（多行 script 会被拆行执行）—— 一律写单行
            grep -qiE 'HALF_FOLDED|HALF_OPENED|CLOSED|OPENED' /tmp/states.txt || { echo "::error::fold 模拟器没报折叠态（print-states 如上）—— AVD profile 或 API 级别变了"; exit 1; }

            # 2) 装 APK 并拉起（包名与壳工程一致：com.gox.demo）
            adb install -r /tmp/apk/*.apk
            adb shell am start -W -n com.gox.demo/.MainActivity || adb shell monkey -p com.gox.demo -c android.intent.category.LAUNCHER 1
            sleep 3

            # 3) 逐个折叠态切换并截图 —— 顺序即折叠屏生命周期的真机时序
            #    （先 onConfigurationChanged 后 foldStatusChange，见
            #    gfx/lifecycle_fold_test.go 的注释与 mobile-device-accept.sh §4）
            mkdir -p /tmp/fold-shots
            for s in CLOSED HALF_FOLDED HALF_OPENED OPENED; do
              case " $STATES " in *" $s "*) ;; *) continue ;; esac
              adb shell "cmd device_state state $s" || true
              sleep 2
              adb exec-out screencap -p > "/tmp/fold-shots/state-${s}-$(date +%s).png"
            done

            # 4) 证据：切换期间不能有崩溃 / ANR
            adb shell "logcat -d -v time | grep -iE 'FATAL EXCEPTION|ANR in|has died' | head -40; echo [scan done]" > /tmp/fold-logcat.txt
            cat /tmp/fold-logcat.txt
            if grep -qiE 'FATAL EXCEPTION|ANR in' /tmp/fold-logcat.txt; then
              echo "::error::折叠态切换期间出现未捕获异常/ANR（原文在 artifacts 的 fold-logcat.txt）"
              exit 1
            fi

      - name: 归档折叠态截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-fold-shots
          path: |
            /tmp/fold-shots/*.png
            /tmp/states.txt
            /tmp/fold-logcat.txt
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # iOS 模拟器机型矩阵（看板单 rSm7zW / S4 / N4）
  #
  # 边界先写死：**iOS 模拟器没有折叠屏**。GoxDisplayFold.swift 依赖的
  # UIView.reservedRegions 是 iOS 27.1+ 的折叠屏 API，模拟器上只报 flat ——
  # 这是已知边界，不是 bug。所以本矩阵验的是**机型/方向 → 断点与布局**，
  # 不是折叠；折叠语义的真机证据在 android-fold-emulator（pixel_fold 是
  # 真能切铰链的）与 scripts/mobile-device-accept.sh §4。
  # ─────────────────────────────────────────────────────────────────────────
  ios-device-matrix:
    name: iOS 机型矩阵（${{ matrix.device }}；flat-only 边界）
    needs: [ios]
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 三个代表尺寸档：6.1" 标准 / 6.9" Pro Max / iPad（breakpoint 三档都能压到）。
        # 注意值是**匹配模式**不是具体机型 —— runner 的 Xcode 设备表随版本漂移
        # （Xcode 26 / iOS 26.5 起设备表里已无 "iPhone 16"，硬编码会挂在
        # "Invalid device or device pair"），步骤里用 devicetypes 探测解析出
        # 当前 runner 上真实存在的机型名。
        device: ["iphone", "iphone pro max", "ipad pro"]
    steps:
      - uses: actions/checkout@v4

      - name: 下载冒烟 .app（ios job 的产物）
        uses: actions/download-artifact@v4
        with:
          name: gox-ios-simulator-app
          path: /tmp/iosapp

      - name: simctl 机型回归（create → boot → install → launch → screenshot）
        env:
          DEVICE_PATTERN: ${{ matrix.device }}
        run: |
          set -euo pipefail

          # 按模式解析当前 runner 上实际存在的机型（devicetypes 列表从新到旧排，
          # 取第一个即最新一代；排除 SE）。
          DEVICE_NAME=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          want = '$DEVICE_PATTERN'.lower()
          names = [dt['name'] for dt in json.load(sys.stdin)['devicetypes']]
          hit = [n for n in names if want in n.lower() and 'SE' not in n]
          print(hit[0] if hit else '')
          ")
          test -n "$DEVICE_NAME" || { echo "::error::devicetypes 里匹配不到 '$DEVICE_PATTERN'（可用列表见 xcrun simctl list devicetypes）"; exit 1; }
          echo "==> 解析到机型: $DEVICE_NAME"

          cd /tmp/iosapp
          unzip -qo gox-smoke-ios-sim.zip -d appdir
          # 上传侧 `zip -qry out.zip smoke/dist/Gox.app` 存的是整条相对路径，
          # .app 落在 appdir/smoke/dist/ 下（第 3 层）—— 深度放宽到 4。
          APP=$(find appdir -name "*.app" -maxdepth 4 | head -1)
          test -n "$APP" || { echo "::error::zip 里没找到 .app"; exit 1; }
          # bundle id 不猜：从 Info.plist 读（XcodeGen 拼的 com.gox.Gox 若改名，
          # 这里跟着走，不用改两处）
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          echo "==> bundle id: $BID"

          # create 的 stdout 只回 UDID；stderr 的 runtime 提示别掺进变量
          UDID=$(xcrun simctl create "gox-matrix-${GITHUB_RUN_ID}-${DEVICE_NAME// /-}" "$DEVICE_NAME")
          trap 'xcrun simctl shutdown "$UDID" 2>/dev/null || true; xcrun simctl delete "$UDID" 2>/dev/null || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP"
          # launch 成功会输出 "com.x.y: <pid>"；没有 pid 就是起不来
          OUT=$(xcrun simctl launch "$UDID" "$BID" 2>&1)
          echo "$OUT"
          printf '%s' "$OUT" | grep -qE '[0-9]+$' || { echo "::error::launch 没回 pid：$OUT"; exit 1; }
          sleep 4

          mkdir -p /tmp/ios-shots
          xcrun simctl io "$UDID" screenshot "/tmp/ios-shots/${DEVICE_NAME// /-}-portrait.png"
          # 方向翻转一档：验断点随方向重算（matrix 的核心证据之一）
          xcrun simctl ui "$UDID" orientation landscape 2>/dev/null || true
          sleep 2
          xcrun simctl io "$UDID" screenshot "/tmp/ios-shots/${DEVICE_NAME// /-}-landscape.png" || true

      - name: 归档机型截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-matrix-${{ matrix.device }}
          path: /tmp/ios-shots/*.png
          if-no-files-found: ignore
