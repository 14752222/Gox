# 折叠屏支持需要 Jetpack WindowManager (androidx.window) —— 它的
# `FoldingFeature` 是**唯一**能拿到铰链位置与姿态的公开 API, 平台层没有
# 等价物 (Display.getRotation / Configuration 只说"屏幕上变了", 不说
# "折痕在哪")。引 androidx 意味着 useAndroidX 必须开。
#
# 代价是已知的: 多一类下载失败与版本冲突的可能 (这正是当初关掉它的理由)。
# 取舍是**接受** —— 折叠屏适配是本轮目标, 而"避开折痕"没有别的实现路径:
# 自己在 SurfaceView 上猜屏幕中间是错的 (折痕不在几何中心, 且外接屏幕 /
# 三折叠下更不成立)。
android.useAndroidX=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
