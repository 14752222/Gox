# XcodeGen 工程定义: `xcodegen generate` 生成 Gox.xcodeproj。
#
# 前置: 先跑 `bash scripts/build-ios.sh`（真机）或 `--sim`（模拟器）,
# 脚本会把产物 (libgox.a + libgox.h) 拷进 libs/<sdk>-<arch>/ —— README 有完整流程。
#
# 静态库必须 -force_load: Go 的 c-archive 靠符号表拉对象会漏掉只被运行时
# 引用的初始化段, 症状是启动即挂。
name: Gox
options:
  bundleIdPrefix: com.gox
  # 最低支持版本**故意留在 15.0**, 不随折叠屏提到 27.1:
  # `reservedRegions` 等 iPhone Duo 能力全部包在 `#available(iOS 27.1, *)`
  # 里 (见 App/Sources/GoxDisplayFold.swift), 老设备走降级分支 (非折叠 = 
  # Foldable false, 分栏退回按宽度类判), 功能不受影响。
  # 提门槛只会白白丢掉 15~26 的用户, 却换不到任何东西 —— 除非将来有
  # **必须**用新 API 才能实现、且无法降级的需求。
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Gox-Bridging-Header.h
    HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/libs/iphonesimulator-arm64 $(SRCROOT)/libs/iphoneos-arm64
    # Go 运行时需要的系统库 (gomobile 同款清单的子集; v1 用到的就这些)
    OTHER_LDFLAGS: $(inherited) -lresolv
  configs:
    Debug:
      OTHER_LDFLAGS[sdk=iphonesimulator*]: $(inherited) -force_load $(SRCROOT)/libs/iphonesimulator-arm64/libgox.a
      OTHER_LDFLAGS[sdk=iphoneos*]: $(inherited) -force_load $(SRCROOT)/libs/iphoneos-arm64/libgox.a
    Release:
      OTHER_LDFLAGS[sdk=iphonesimulator*]: $(inherited) -force_load $(SRCROOT)/libs/iphonesimulator-arm64/libgox.a
      OTHER_LDFLAGS[sdk=iphoneos*]: $(inherited) -force_load $(SRCROOT)/libs/iphoneos-arm64/libgox.a

targets:
  Gox:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/assets      # 随包脚本 (与 Android 壳的 assets/app.js 同角色)
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        # 方向列表含横屏: gx/app 的 setOrientation("landscape") 需要
        # (初始 mask 仍是 portrait, 见 AppDelegate/GoxNativeHost.orientationMask)。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # NativeHost 权限用途描述 (占位文案, 发布前按实际用途改写):
        NSCameraUsageDescription: 需要相机用于拍摄照片 (takePhoto)
        NSMicrophoneUsageDescription: 需要麦克风用于录制视频的声音
        NSLocationWhenInUseUsageDescription: 需要定位用于获取当前位置 (getLocation / watchLocation)
        NSPhotoLibraryAddUsageDescription: 需要保存照片到系统相册 (saveImage)
        NSPhotoLibraryUsageDescription: 需要访问相册用于读取照片
        # 新 SDK (iOS 27) 强制 scene 生命周期: 必须声明 scene manifest,
        # 否则启动即失败 ("UIScene life cycle is required")。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
